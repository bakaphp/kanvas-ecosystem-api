x-common-queue-settings: &common-queue-settings
    restart: always
    build:
        context: .
        dockerfile: development.Dockerfile
    extra_hosts:
        - "host.docker.internal:host-gateway"
    command:
        - "sh"
        - "-c"
        - "php artisan config:cache && php artisan queue:work
          --tries=3 --timeout=3750"
    environment:
        WWWUSER: "${WWWUSER}"
        LARAVEL_SAIL: 1
        XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
        XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
    volumes:
        - ".:/var/www/html"
        - ./docker/docker-php-ext-opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini
        - ./docker/php.ini:/usr/local/etc/php/conf.d/xz-custom.ini
    networks:
        - sail

services:
    php:
        container_name: php${APP_CONTAINER_NAME}
        build:
            context: .
            dockerfile: development.Dockerfile
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command:
            - "sh"
            - "-c"
            - "php artisan octane:start --server=swoole --task-workers=2
              --workers=2"
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
        volumes:
            - ".:/var/www/html"
            - ../kanvas-core:/var/www/kanvas-core
            - ./docker/docker-php-ext-opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini
            - ./docker/php.ini:/usr/local/etc/php/conf.d/xz-custom.ini
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    queue:
        <<: *common-queue-settings
        container_name: queue
    batch-logger-queue:
        <<: *common-queue-settings
        container_name: batch-logger-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=batch-logger --tries=3 --timeout=3750"
    agent-runtime-queue:
        <<: *common-queue-settings
        container_name: agent-runtime-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=agent-runtime --tries=3 --timeout=3750"
    product-enrichment-queue:
        <<: *common-queue-settings
        container_name: product-enrichment-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=product-enrichment --tries=3 --timeout=3750"
    product-discovery-queue:
        <<: *common-queue-settings
        container_name: product-discovery-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=product-discovery --tries=3 --timeout=300"
    scout-queue:
        <<: *common-queue-settings
        container_name: scout-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=scout --tries=3 --timeout=300"
    agent-chat-queue:
        <<: *common-queue-settings
        container_name: agent-chat-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=agent-chat --tries=1 --timeout=3750"
    broadcasts-queue:
        <<: *common-queue-settings
        container_name: broadcasts-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=broadcasts --tries=3 --timeout=60"
    ledger-queue:
        <<: *common-queue-settings
        container_name: ledger-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work --queue=ledger
              --tries=3 --timeout=3750"
    slack-ingest-queue:
        <<: *common-queue-settings
        container_name: slack-ingest-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=slack-ingest --tries=3 --timeout=3750"
    nervous-system-project-queue:
        <<: *common-queue-settings
        container_name: nervous-system-project-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=nervous-system-project --tries=3 --timeout=3750"
    scheduled-actions-queue:
        <<: *common-queue-settings
        container_name: scheduled-actions-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=scheduled-actions --tries=3 --timeout=3750"
    scribe-aging-queue:
        <<: *common-queue-settings
        container_name: scribe-aging-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=scribe-aging --tries=3 --timeout=3750"
    scribe-pdf-ingest-queue:
        <<: *common-queue-settings
        container_name: scribe-pdf-ingest-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=scribe-pdf-ingest --tries=3 --timeout=3750"
    lead-follow-ups-queue:
        <<: *common-queue-settings
        container_name: lead-follow-ups-queue
        command:
            - "sh"
            - "-c"
            - "php artisan config:cache && php artisan queue:work
              --queue=lead_follow_ups --tries=3 --timeout=3750"

    reverb:
        container_name: reverb${APP_CONTAINER_NAME}
        build:
            context: .
            dockerfile: development.Dockerfile
        extra_hosts:
            - "host.docker.internal:host-gateway"
        # command:
        #     - "sh"
        #     - "-c"
        #     - "php artisan reverb:start --host=0.0.0.0 --port=9000"
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
        ports:
            - "9000:9000"
        volumes:
            - ".:/var/www/html"
            - ./docker/docker-php-ext-opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini
            - ./docker/php.ini:/usr/local/etc/php/conf.d/xz-custom.ini
        networks:
            - sail
        depends_on:
            - redis

    nginx:
        image: nginx:latest
        container_name: nginx${APP_CONTAINER_NAME}
        ports:
            - "80:80"
        links:
            - php
        volumes:
            - ".:/var/www/html"
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - sail
        depends_on:
            - php
        healthcheck:
            test: [ "CMD", "service", "nginx", "status" ]
            retries: 3
            timeout: 5s
    mysql:
        container_name: mysql${APP_CONTAINER_NAME}
        image: "mysql:8.3.0"
        command: --innodb_strict_mode=0 --innodb_log_file_size=512M
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - "sail-mysql:/var/lib/mysql"
        networks:
            - sail
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}" ]
            retries: 3
            timeout: 5s
    redis:
        container_name: redis${APP_CONTAINER_NAME}
        image: "redis:alpine"
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - sail
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            retries: 3
            timeout: 5s

    rabbitmq:
        container_name: rabbitmq${APP_CONTAINER_NAME}
        image: rabbitmq:3.9.21-management-alpine
        hostname: "rabbit"
        labels:
            NAME: "rabbitmq1"
        volumes:
            - "sail-rabbitmq:/var/lib/rabbitmq"
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 30s
            timeout: 30s
            retries: 3
        ports:
            - "15672:15672"
            - "5672:5672"
        networks:
            - sail
    mailpit:
        image: "axllent/mailpit:latest"
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - sail
    phpmyadmin:
        image: phpmyadmin/phpmyadmin:5.0.2
        container_name: phpmyadmin${APP_CONTAINER_NAME}
        restart: always
        environment:
            - PMA_HOST=mysql
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
        ports:
            - "9010:80"

        volumes:
            - pma:/var/www/html

        networks:
            - sail
    typesense:
        image: typesense/typesense:27.1
        restart: on-failure
        ports:
            - "8108:8108"
        volumes:
            - typesense-data:/data
        command: "--data-dir /data --api-key=xyz --enable-cors"
        networks:
            - sail
    admin_dashboard:
        container_name: admin_dashboard
        image: ghcr.io/lewynation/typesense-admin-dashboard:latest
        restart: always
        ports:
            - 3005:3000
    dashboard_typesense:
        container_name: dashboard_typesense
        image: bfritscher/typesense-dashboard
        restart: always
        ports:
            - 8086:80
    minio1:
        image: minio/minio
        container_name: minio${APP_CONTAINER_NAME}
        restart: always
        environment:
            MINIO_ACCESS_KEY: minio
            MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
        command: server /data --console-address ":9001"
        ports:
            - "9002:9000"
            - "9001:9001"
        volumes:
            - s3data:/data
        networks:
            - sail

    puppeteer:
        image: browserless/chrome
        container_name: puppeteer${APP_CONTAINER_NAME}
        environment:
            # Enable preloading to optimize performance
            - PREBOOT_CHROME=true
            # Optional: Define the max concurrency if required
            - MAX_CONCURRENT_SESSIONS=10
            # Optional: You can set a custom token for API security
            # - TOKEN=your_secure_token
        ports:
            - "3000:3000" # Expose Puppeteer API on port 3000
        restart: always
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    pma:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-rabbitmq:
        driver: local
    s3data:
    meilisearch:
    typesense-data:
