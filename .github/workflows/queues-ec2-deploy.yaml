name: Deploy to Queues EC2

on:
  push:
    branches:
      - "1.x"
  workflow_dispatch:

jobs:
  deploy-to-queues-ec2:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # rsync --delete so renames/deletions in git are reflected on the server.
      # Plain scp is additive and leaves stale files behind, which corrupts the
      # Lighthouse schema merge whenever a .graphql file moves (see incident
      # 2026-05-14: duplicate agentCurrentTelemetry → "Failed to load type: _").
      - name: Sync repo to remote VM (rsync --delete)
        uses: burnett01/rsync-deployments@9.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude='/.git'
            --exclude='/.env'
            --exclude='/storage'
            --exclude='/bootstrap/cache'
            --exclude='/node_modules'
            --exclude='/vendor'
          path: ./
          remote_path: ${{ secrets.AWS_EC2_TARGET_DIR }}
          remote_host: ${{ secrets.AWS_QUEUE_EC2_HOST }}
          remote_user: ${{ secrets.AWS_EC2_USERNAME }}
          remote_key: ${{ secrets.AWS_EC2_PRIVATE_SSH_KEY }}

  docker-command:
    runs-on: ubuntu-latest
    needs: deploy-to-queues-ec2
    environment: ${{ github.ref_name }}
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AWS_QUEUE_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_PRIVATE_SSH_KEY }}
          script: |
            cd ${{ secrets.AWS_EC2_TARGET_DIR }}

            COMPOSE="docker-compose -f docker-compose.${{ github.ref_name }}.yml"

            $COMPOSE up -d --remove-orphans
            sh scripts/deploy/prune-stopped-containers.sh
            docker exec -i phpkanvas-ecosystem composer install --no-dev --optimize-autoloader

            docker exec -i phpkanvas-ecosystem php artisan lighthouse:cache
            docker exec -i phpkanvas-ecosystem php artisan lighthouse:clear-cache all
            docker exec -i phpkanvas-ecosystem php artisan config:cache

            # No migrations here — this host shares the 1.x database, migrations
            # are run by hand after review.
            docker exec -i phpkanvas-ecosystem php artisan kanvas:workflow-sync-actions
            docker exec -i phpkanvas-ecosystem php artisan kanvas:intelligence:sync-agent-types
            docker exec -i phpkanvas-ecosystem php artisan kanvas:nervous-system:sync-tools

            docker stop nginxkanvas-ecosystem
            docker stop rediskanvas-ecosystem

            # Recreate (not restart) every worker and the scheduler so they pick up new code AND start
            # from a fresh writable layer — `docker restart` keeps the layer, so every temp file a job
            # leaked into /tmp survived every deploy. Names come from docker-compose, no list to rot.
            $COMPOSE up -d --force-recreate --no-deps $($COMPOSE config --services | grep -E 'queue|scheduler')

            docker exec -i phpkanvas-ecosystem php artisan octane:reload
