name: Ansible GCP Compute Deploy

on:
  workflow_dispatch:
    

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and GCP collection
        run: |
          pip install ansible google-auth requests google-auth-httplib2
          ansible-galaxy collection install google.cloud ansible.posix

      - name: Create inventory file
        run: |
          cat > ansible/inventory.gcp.yaml << EOF
          plugin: google.cloud.gcp_compute
          projects:
            - ${{ secrets.GCP_PROJECT_ID }}
          regions:
            - ${{ secrets.GCP_REGION }}
          filters:
            - status = RUNNING
          auth_kind: application
          hostnames:
            - name
          compose:
            ansible_host: networkInterfaces[0].networkIP
            ansible_user: sa_${{ secrets.GCP_SERVICE_ACCOUNT_UNIQUE_ID }}
          groups:
            ${{ github.ref_name }}: "'${{ secrets.INSTANCE_GROUP_NAME }}' in name"
          EOF

      - name: Create IAP SSH wrapper
        run: |
          mkdir -p ~/bin
          cat > ~/bin/iap-ssh-wrapper.sh << 'EOF'
          #!/bin/bash
          # IAP SSH Wrapper - automatically finds instance zone
          HOST=$1
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"

          # HOST is an internal IP, find the instance name and zone
          INSTANCE_INFO=$(gcloud compute instances list \
            --project="$PROJECT" \
            --filter="networkInterfaces[].networkIP:$HOST AND status=RUNNING" \
            --format="value(name,zone)")

          INSTANCE_NAME=$(echo "$INSTANCE_INFO" | awk '{print $1}')
          ZONE=$(echo "$INSTANCE_INFO" | awk '{print $2}')

          if [ -z "$INSTANCE_NAME" ] || [ -z "$ZONE" ]; then
            echo "Error: Could not find instance for IP $HOST" >&2
            exit 1
          fi

          # Start IAP tunnel using instance NAME, not IP
          exec gcloud compute start-iap-tunnel "$INSTANCE_NAME" 22 \
            --listen-on-stdin \
            --project="$PROJECT" \
            --zone="$ZONE" \
            --verbosity=warning
          EOF
          chmod +x ~/bin/iap-ssh-wrapper.sh

          # Create SSH config
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << 'SSHEOF'
          Host 10.*
            ProxyCommand ~/bin/iap-ssh-wrapper.sh %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Verify inventory
        run: |
          echo "Testing inventory discovery..."
          ansible-inventory -i ansible/inventory.gcp.yaml --list
          echo "Inventory hosts:"
          ansible-inventory -i ansible/inventory.gcp.yaml --graph

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
        run: |
          ansible-playbook ansible/playbooks/${{ github.ref_name }}-deploy.yaml \
            -i ansible/inventory.gcp.yaml \
            -e '{
              "app_dir": "/var/www/html",
              "repo_url": "git@github.com:${{ github.repository }}.git",
              "branch": "${{ github.ref_name }}"
            }'