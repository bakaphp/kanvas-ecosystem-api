name: Ansible GCP Compute Deploy

on:
  workflow_dispatch:
    

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and GCP collection
        run: |
          pip install ansible google-auth requests google-auth-httplib2
          ansible-galaxy collection install google.cloud ansible.posix

      - name: Create inventory file
        run: |
          cat > ansible/inventory.gcp.yaml << EOF
          plugin: google.cloud.gcp_compute
          projects:
            - ${{ secrets.GCP_PROJECT_ID }}
          regions:
            - ${{ secrets.GCP_REGION }}
          filters:
            - status = RUNNING
          auth_kind: application
          hostnames:
            - name
          compose:
            ansible_host: networkInterfaces[0].accessConfigs[0].natIP
            ansible_user: ubuntu
          groups:
            ${{ github.ref_name }}: "'${{ secrets.INSTANCE_GROUP_NAME }}' in name"
          EOF

      - name: Create GitHub Actions SSH firewall rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch GitHub Actions IP ranges from GitHub's meta API (authenticated to avoid rate limits)
          echo "Fetching GitHub Actions IP ranges..."
          API_RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/meta)

          # Check if we got a valid response
          if ! echo "$API_RESPONSE" | jq -e '.actions' > /dev/null 2>&1; then
            echo "Error: Failed to fetch GitHub Actions IPs. API response:"
            echo "$API_RESPONSE"
            exit 1
          fi

          # Save IPs to a file for processing
          echo "$API_RESPONSE" | jq -r '.actions[]' > /tmp/github_ips.txt
          TOTAL_IPS=$(wc -l < /tmp/github_ips.txt)

          if [ "$TOTAL_IPS" -eq 0 ]; then
            echo "Error: No GitHub Actions IPs found"
            exit 1
          fi

          echo "GitHub Actions IP ranges fetched successfully ($TOTAL_IPS ranges)"

          # GCP firewall rules have a limit of 256 source ranges per rule
          # Split into chunks of 250 to be safe
          CHUNK_SIZE=250
          CHUNK_NUM=0

          # Get the network name from the first matching instance
          NETWORK=$(gcloud compute instances list \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --filter="name~'${{ secrets.INSTANCE_GROUP_NAME }}' AND status=RUNNING" \
            --format="value(networkInterfaces[0].network)" \
            --limit=1 | awk -F'/' '{print $NF}')

          echo "Using network: $NETWORK"

          # Delete existing firewall rules for github-actions
          echo "Cleaning up existing GitHub Actions firewall rules..."
          gcloud compute firewall-rules list \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --filter="name~allow-ssh-github-actions" \
            --format="value(name)" | while read -r RULE_NAME; do
            if [ -n "$RULE_NAME" ]; then
              echo "Deleting rule: $RULE_NAME"
              gcloud compute firewall-rules delete "$RULE_NAME" \
                --project="${{ secrets.GCP_PROJECT_ID }}" \
                --quiet
            fi
          done

          # Create firewall rules in chunks
          split -l $CHUNK_SIZE /tmp/github_ips.txt /tmp/github_ips_chunk_

          for CHUNK_FILE in /tmp/github_ips_chunk_*; do
            CHUNK_IPS=$(cat "$CHUNK_FILE" | tr '\n' ',' | sed 's/,$//')
            RULE_NAME="allow-ssh-github-actions-${CHUNK_NUM}"

            echo "Creating firewall rule: $RULE_NAME ($(wc -l < "$CHUNK_FILE") ranges)"

            gcloud compute firewall-rules create "$RULE_NAME" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --network="$NETWORK" \
              --direction=INGRESS \
              --priority=1000 \
              --action=ALLOW \
              --rules=tcp:22 \
              --source-ranges="$CHUNK_IPS" \
              --target-tags="${{ secrets.INSTANCE_GROUP_NAME }}" \
              --description="Allow SSH from GitHub Actions runners (part $CHUNK_NUM)"

            CHUNK_NUM=$((CHUNK_NUM + 1))
          done

          echo "Created $CHUNK_NUM firewall rules for GitHub Actions IPs"

      - name: Verify inventory
        run: |
          echo "Testing inventory discovery..."
          ansible-inventory -i ansible/inventory.gcp.yaml --list
          echo "Inventory hosts:"
          ansible-inventory -i ansible/inventory.gcp.yaml --graph
      
      - name: Setup SSH key for ubuntu user
        run: |
          # Generate SSH key
          mkdir -p /home/runner/.ssh
          ssh-keygen -t rsa -b 3072 -N '' -f /home/runner/.ssh/id_rsa
          SSH_PUBLIC_KEY=$(cat /home/runner/.ssh/id_rsa.pub)

          # Configure SSH for direct connections
          cat > /home/runner/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
          EOF
          chmod 600 /home/runner/.ssh/config

          # Get all matching instances (name and zone)
          gcloud compute instances list \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --filter="name~'${{ secrets.INSTANCE_GROUP_NAME }}' AND status=RUNNING" \
            --format="value(name,zone)" | while read -r INSTANCE_NAME ZONE; do

            echo "Adding SSH key to instance: $INSTANCE_NAME (zone: $ZONE)"
            gcloud compute instances add-metadata "$INSTANCE_NAME" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --zone="$ZONE" \
              --metadata "ssh-keys=ubuntu:$SSH_PUBLIC_KEY"
          done

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
        run: |
          ansible-playbook ansible/playbooks/${{ github.ref_name }}-deploy.yaml \
            -i ansible/inventory.gcp.yaml \
            -e '{
              "app_dir": "${{ secrets.GCP_INSTANCE_APP_DIR }}",
              "repo_url": "git@github.com:${{ github.repository }}.git",
              "branch": "${{ github.ref_name }}"
            }'