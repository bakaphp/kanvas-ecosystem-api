name: Ansible GCP Compute Deploy

on:
  workflow_dispatch:
    

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and GCP collection
        run: |
          pip install ansible google-auth
          ansible-galaxy collection install google.cloud

      - name: Create inventory file
        run: |
          cat > ansible/inventory.gcp.yml << EOF
          plugin: google.cloud.gcp_compute
          projects:
            - ${{ secrets.GCP_PROJECT_ID }}
          regions:
            - ${{ secrets.GCP_REGION }}
          filters:
            - status = RUNNING
          auth_kind: application
          groups:
            ${{ github.ref_name }} "'${{ secrets.INSTANCE_GROUP_NAME }}' in name"
          EOF

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
        run: |
          ansible-playbook ansible/playbooks/${{ github.ref_name }}-deploy.yaml \
            -i ansible/inventory.gcp.yml \
            --ssh-common-args="-o StrictHostKeyChecking=no" \
            -e '{
              "app_dir": "/var/www/html",
              "repo_url": "git@github.com:${{ github.repository }}.git",
              "branch": "${{ github.ref_name }}"
            }'