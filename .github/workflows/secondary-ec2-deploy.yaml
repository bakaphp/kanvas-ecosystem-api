name: Deploy to Secondary EC2

on:
  push:
    branches:
      - "1.x"
  workflow_dispatch: {}

jobs:
  deploy-to-ec2:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # rsync --delete so renames/deletions in git are reflected on the server.
      # Plain scp is additive and leaves stale files behind, which corrupts the
      # Lighthouse schema merge whenever a .graphql file moves (see incident
      # 2026-05-14: duplicate agentCurrentTelemetry → "Failed to load type: _").
      - name: Sync repo to remote VM (rsync --delete)
        uses: burnett01/rsync-deployments@8.0.5
        with:
          switches: >-
            -avzr --delete
            --exclude='/.git'
            --exclude='/.env'
            --exclude='/storage'
            --exclude='/bootstrap/cache'
            --exclude='/node_modules'
            --exclude='/vendor'
          path: ./
          remote_path: ${{ secrets.AWS_TEST_EC2_TARGET_DIR }}
          remote_host: ${{ secrets.AWS_TEST_EC2_HOST }}
          remote_user: ${{ secrets.AWS_TEST_EC2_USERNAME }}
          remote_key: ${{ secrets.AWS_TEST_EC2_PRIVATE_SSH_KEY }}

  docker-command:
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    environment: ${{ github.ref_name }}
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AWS_TEST_EC2_HOST }}
          username: ${{ secrets.AWS_TEST_EC2_USERNAME }}
          key: ${{ secrets.AWS_TEST_EC2_PRIVATE_SSH_KEY }}
          script: |
            cd ${{ secrets.AWS_TEST_EC2_TARGET_DIR }}

            docker-compose -f docker-compose.${{ github.ref_name }}.yml up -d
            docker exec -i phpkanvas-ecosystem composer install --no-dev --optimize-autoloader

            docker exec -i phpkanvas-ecosystem php artisan lighthouse:cache
            docker exec -i phpkanvas-ecosystem php artisan lighthouse:clear-cache all
            docker exec -i phpkanvas-ecosystem php artisan config:cache

            docker stop rediskanvas-ecosystem
            docker restart queue-scrapper
            docker stop queue-scrapper-worker-{1..4}
            docker restart queue
            docker restart queue-imports
            docker stop queue-notifications
            docker stop queue-social
            docker restart laravel-scheduler
            docker stop queue-sync-shopify-queue
            docker stop queue-sync-shopify-queue-worker-{1..2}
            docker restart queue-scout-worker-1
            docker stop queue-scout-worker-2
            docker stop queue-scout-worker-3
            docker restart queue-workflow-{1..2}
            docker stop queue-workflow-3
            docker stop batch-logger-queue
            docker restart agent-runtime-queue
            docker restart ledger-queue
            docker stop queue-user-interactions

            if [ "${{ github.ref_name }}" == "1.x" ]; then
              docker restart queue{,2,3,4,5,6,7,8} queue-imports{2,3,4} queue-workflow-{1..4} queue-scout-worker-{2,3} queue-notifications
            fi

            docker exec -i phpkanvas-ecosystem php artisan octane:reload
