---
- name: Deploy app to all instances
  hosts: development
  become: true
  strategy: free  # Run on all hosts in parallel

  # vars:
  #   app_dir: /var/www/html
  #   repo_url: git@github.com:yourorg/yourrepo.git
  #   branch: development

  tasks:
    - name: Sync app files
      ansible.posix.synchronize:
        src: ../../
        dest: "{{ app_dir }}"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=vendor"
          - "--exclude=.env"
          - "--exclude=storage/logs/*"
          - "--exclude=ansible"
      
    - name: Docker compose deploy
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files:
          - docker-compose.development.yaml
        state: present
        recreate: always # Always recreate containers
        build: never # Avoid rebuilding images

    - name: Install dependencies inside container
      shell: docker-compose exec -T php composer install --optimize-autoloader
      args:
        chdir: "{{ app_dir }}"

    # - name: Clear and cache config
    #   shell: |
    #     php artisan config:cache
    #     php artisan route:cache
    #     php artisan view:cache
    #   args:
    #     chdir: "{{ app_dir }}"