---
- name: Deploy app to all instances
  hosts: development
  become: true
  strategy: free  # Run on all hosts in parallel

  # vars:
  #   app_dir: /var/www/html
  #   repo_url: git@github.com:yourorg/yourrepo.git
  #   branch: development

  tasks:
    - name: Sync app files
      ansible.posix.synchronize:
        src: ./
        dest: "{{ app_dir }}"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=vendor"
          - "--exclude=.env"
          - "--exclude=storage/logs/*"
          - "--exclude=ansible"

    - name: Verify the files are there
      shell: ls -lash
      register: ls_output
      args:
        chdir: "{{ app_dir }}"

    - name: Show files
      debug:
        msg: "{{ ls_output.stdout_lines }}"

