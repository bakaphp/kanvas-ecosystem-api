---
- name: Deploy app to all instances
  hosts: development
  become: true
  strategy: free  # Run on all hosts in parallel

  # vars:
  #   app_dir: /var/www/html
  #   repo_url: git@github.com:yourorg/yourrepo.git
  #   branch: development

  tasks:
    - name: Sync app files
      ansible.posix.synchronize:
        src: ../../
        dest: "{{ app_dir }}"
        delete: yes
        verbose: yes
        verbosity: 2
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=vendor"
          - "--exclude=.env"
          - "--exclude=storage/logs/*"
          - "--exclude=ansible"

    - name: Ensure Docker Compose plugin is installed
      shell: |
        if ! docker compose version > /dev/null 2>&1; then
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
        fi
      args:
        creates: /usr/local/lib/docker/cli-plugins/docker-compose

    - name: Docker compose deploy
      shell: docker compose -f docker-compose.development.yaml up -d --force-recreate
      args:
        chdir: "{{ app_dir }}"

    - name: Install dependencies inside container
      shell: docker compose -f docker-compose.development.yaml exec -T php composer install --optimize-autoloader
      args:
        chdir: "{{ app_dir }}"

