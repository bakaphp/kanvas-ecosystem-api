receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  spanmetrics:
    dimensions:
      - name: gen_ai.system
      - name: gen_ai.request.model
      - name: agent.deployment_id
      - name: agent.container_name
    metrics_flush_interval: 30s

processors:
  batch:
    timeout: 30s
  filter/genai:
    error_mode: ignore
    spans:
      include:
        match_type: regexp
        attributes:
          - key: gen_ai.system
            value: ".*"

exporters:
  otlphttp/kanvas:
    endpoint: http://php:8000
    tls:
      insecure: true
    headers:
      X-Internal-Token: "${env:OTEL_INTERNAL_TOKEN}"
  # Uncomment for debugging — prints received spans/metrics to container logs
  # debug:
  #   verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/genai, batch]
      exporters: [spanmetrics]
    metrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [otlphttp/kanvas]
