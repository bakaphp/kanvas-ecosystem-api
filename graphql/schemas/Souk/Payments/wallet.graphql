type WalletResult {
    balance: Money
    message: Mixed
    data: Mixed
}

type WalletTransaction {
    id: ID!
    uuid: String!
    type: String! @method(name: "getTypeStringAttribute")
    amount: Money! @method(name: "getAmountFloatAttribute")
    confirmed: Boolean!
    status: String
    meta: Mixed
    created_at: DateTimeTz
}

input WalletRefundInput {
    order_id: ID!
    amount: Float
    reason: String
    tag: String
}

input WalletMetaFilter {
    path: String!
    value: String!        # When operator is LIKE, the caller must supply SQL wildcards (e.g., "paso%")
    operator: MetadataFilterOperator
}

extend type Query @guard {
    getWalletBalance(tag: String!): WalletResult
        @field(
            resolver: "App\\GraphQL\\Souk\\Queries\\Payments\\WalletManagementQuery@getBalance"
        )
    getUserWallet(tag: String!, userId: ID, metadata: Mixed): WalletResult
        @field(
            resolver: "App\\GraphQL\\Souk\\Queries\\Payments\\WalletManagementQuery@getUserWalletBalance"
        )
    getWalletTransactions(
        tag: String!
        hasMeta: WalletMetaFilter
        where: _
            @whereConditions(
                columns: ["id", "uuid", "type", "amount", "confirmed", "status"]
            )
        orderBy: _ @orderBy(columns: ["id", "status", "created_at"])
    ): [WalletTransaction!]!
        @paginate(
            builder: "App\\GraphQL\\Souk\\Queries\\Payments\\WalletManagementQuery@getTransactions"
            defaultCount: 25
        )
    getUserWalletTransactions(
        tag: String!
        hasMeta: WalletMetaFilter
        where: _
            @whereConditions(
                columns: ["id", "uuid", "type", "amount", "confirmed", "status"]
            )
        orderBy: _ @orderBy(columns: ["id", "status", "created_at"])
    ): [WalletTransaction!]!
        @paginate(
            builder: "App\\GraphQL\\Souk\\Queries\\Payments\\WalletManagementQuery@getUserTransactions"
            defaultCount: 25
        )
    getCompanyWallet(tag: String!, company_id: ID!, metadata: Mixed): WalletResult
        @field(
            resolver: "App\\GraphQL\\Souk\\Queries\\Payments\\WalletManagementQuery@getCompanyWalletBalance"
        )
    getCompanyWalletTransactions(
        tag: String!
        company_id: ID!
        hasMeta: WalletMetaFilter
        where: _
            @whereConditions(
                columns: ["id", "uuid", "type", "amount", "confirmed", "status"]
            )
        orderBy: _ @orderBy(columns: ["id", "status", "created_at"])
    ): [WalletTransaction!]!
        @paginate(
            builder: "App\\GraphQL\\Souk\\Queries\\Payments\\WalletManagementQuery@getCompanyTransactions"
            defaultCount: 25
        )
}

extend type Mutation @guardByAppKey {
    flushUserWallet(user_id: ID!, tag: String): WalletResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Payments\\WalletManagementMutation@flushUserWallet"
        )
    flushCompanyWallet(company_id: ID!, tag: String): WalletResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Payments\\WalletManagementMutation@flushCompanyWallet"
        )
    refundOrderToWallet(input: WalletRefundInput!): WalletResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Payments\\WalletManagementMutation@refundOrderToWallet"
        )
}
