        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateMutation@update"
        )
    deleteAffiliate(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateMutation@delete"
        )

    createAffiliateLink(input: AffiliateLinkInput!): AffiliateLink!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateLinkMutation@create"
        )
    updateAffiliateLink(
        id: ID!
        input: UpdateAffiliateLinkInput!
    ): AffiliateLink!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateLinkMutation@update"
        )
    deleteAffiliateLink(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateLinkMutation@delete"
        )

    createAffiliateConversion(
        input: AffiliateConversionInput!
    ): AffiliateConversion!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateConversionMutation@create"
        )
    updateAffiliateConversion(
        id: ID!
        input: UpdateAffiliateConversionInput!
    ): AffiliateConversion!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateConversionMutation@update"
        )
    deleteAffiliateConversion(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateConversionMutation@delete"
        )

    createAffiliateCommissionPayout(
        input: AffiliateCommissionPayoutInput!
    ): AffiliateCommissionPayout!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateCommissionPayoutMutation@create"
        )
    updateAffiliateCommissionPayout(
        id: ID!
        input: UpdateAffiliateCommissionPayoutInput!
    ): AffiliateCommissionPayout!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateCommissionPayoutMutation@update"
        )
    deleteAffiliateCommissionPayout(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateCommissionPayoutMutation@delete"
        )
}

extend type Query @guard {
    affiliatePrograms(
        search: String @search
        where: _
            @whereConditions(
                columns: ["id", "uuid", "name", "slug", "is_active"]
            )
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [AffiliateProgram!]!
        @paginate(
            model: "Kanvas\\Souk\\Affiliates\\Models\\AffiliateProgram"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 25
        )

    affiliateTiers(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "name"
                    "affiliate_programs_id"
                    "is_active"
                    "level"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "name"
                    "level"
                    "weight"
                ]
            )
    ): [AffiliateTier!]!
        @paginate(
            model: "Kanvas\\Souk\\Affiliates\\Models\\AffiliateTier"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 25
        )

    affiliates(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "name"
                    "email"
                    "affiliate_programs_id"
                    "affiliate_tiers_id"
                    "status"
                    "affiliate_type"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "name"
                    "email"
                    "status"
                ]
            )
    ): [Affiliate!]!
        @paginate(
            model: "Kanvas\\Souk\\Affiliates\\Models\\Affiliate"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 25
        )

    affiliateLinks(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "affiliates_id"
                    "name"
                    "short_code"
                    "custom_slug"
                    "is_active"
                    "is_approved"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "name"
                    "click_count"
                    "conversion_count"
                ]
            )
    ): [AffiliateLink!]!
        @paginate(
            model: "Kanvas\\Souk\\Affiliates\\Models\\AffiliateLink"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 25
        )

    affiliateConversions(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "affiliates_id"
                    "affiliate_links_id"
                    "orders_id"
                    "status"
                    "confirmed"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "commission_amount"
                    "converted_at"
                ]
            )
    ): [AffiliateConversion!]!
        @paginate(
            model: "Kanvas\\Souk\\Affiliates\\Models\\AffiliateConversion"
            scopes: ["fromApp", "notDeleted"]
            defaultCount: 25
        )

    affiliateCommissionPayouts(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "affiliates_id"
                    "payout_status"
                    "payout_method"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "net_commission"
                    "payout_date"
                ]
            )
    ): [AffiliateCommissionPayout!]!
        @paginate(
            model: "Kanvas\\Souk\\Affiliates\\Models\\AffiliateCommissionPayout"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 25
        )
}
