        id: ID!
        input: UpdateAffiliateProgramInput!
    ): AffiliateProgram!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateProgramMutation@update"
        )
    deleteAffiliateProgram(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Affiliates\\AffiliateProgramMutation@delete"
        )

    createAffiliateTier(input: AffiliateTierInput!): AffiliateTier!
