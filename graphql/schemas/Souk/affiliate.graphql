enum AffiliateTypeEnum {
    INDIVIDUAL @enum(value: "individual")
    BUSINESS @enum(value: "business")
    INFLUENCER @enum(value: "influencer")
    AGENCY @enum(value: "agency")
}

enum AffiliateStatusEnum {
    PENDING @enum(value: "pending")
    APPROVED @enum(value: "approved")
    ACTIVE @enum(value: "active")
    SUSPENDED @enum(value: "suspended")
    INACTIVE @enum(value: "inactive")
    REJECTED @enum(value: "rejected")
}

enum CommissionTypeEnum {
    PERCENTAGE @enum(value: "percentage")
    FIXED @enum(value: "fixed")
    HYBRID @enum(value: "hybrid")
    TIERED @enum(value: "tiered")
    COMPANY_WALLET @enum(value: "company_wallet")
    USER_WALLET @enum(value: "user_wallet")
}

enum PayoutFrequencyEnum {
    WEEKLY @enum(value: "weekly")
    MONTHLY @enum(value: "monthly")
    QUARTERLY @enum(value: "quarterly")
}

enum PayoutMethodEnum {
    WALLET @enum(value: "wallet")
    BANK_TRANSFER @enum(value: "bank_transfer")
    PAYPAL @enum(value: "paypal")
    STRIPE @enum(value: "stripe")
}

enum AttributionModelEnum {
    FIRST_CLICK @enum(value: "first_click")
    LAST_CLICK @enum(value: "last_click")
    LINEAR @enum(value: "linear")
    TIME_DECAY @enum(value: "time_decay")
}

enum AffiliateConversionStatusEnum {
    PENDING @enum(value: "pending")
    CONFIRMED @enum(value: "confirmed")
    PAID @enum(value: "paid")
    REVERSED @enum(value: "reversed")
    DISPUTED @enum(value: "disputed")
}

enum AffiliatePayoutStatusEnum {
    PENDING_APPROVAL @enum(value: "pending_approval")
    APPROVED @enum(value: "approved")
    PROCESSING @enum(value: "processing")
    COMPLETED @enum(value: "completed")
    FAILED @enum(value: "failed")
    CANCELLED @enum(value: "cancelled")
}

type AffiliateProgram {
    id: ID!
    uuid: String!
    name: String!
    description: String
    slug: String!
    is_active: Boolean!
    accepts_new_affiliates: Boolean!
    require_approval: Boolean!
    default_commission_type: String!
    default_commission_rate: Float!
    tier_based_commission: Boolean!
    default_cookie_duration_days: Int!
    default_attribution_window_days: Int!
    min_payout_amount: Float!
    payout_frequency: String
    payout_methods_allowed: Mixed
    restricted_countries: Mixed
    restricted_categories: Mixed
    restricted_products: Mixed
    configuration: Mixed
    company: Company! @belongsTo
    tiers: [AffiliateTier!] @hasMany(relation: "tiers")
    affiliates: [Affiliate!] @hasMany(relation: "affiliates")
    created_at: DateTime!
    updated_at: DateTime
}

type AffiliateTier {
    id: ID!
    uuid: String!
    name: String!
    description: String
    level: Int!
    weight: Float!
    min_referrals: Int!
    min_monthly_sales: Float
    min_conversion_rate: Float
    min_days_active: Int!
    base_commission_rate: Float!
    commission_multiplier: Float!
    bonus_commission_rate: Float
    early_payout_eligibility: Boolean!
    marketing_material_access: Boolean!
    dedicated_manager: Boolean!
    priority_support: Boolean!
    advanced_reporting: Boolean!
    benefits: Mixed
    is_active: Boolean!
    program: AffiliateProgram! @belongsTo(relation: "program")
    created_at: DateTime!
    updated_at: DateTime
}

type Affiliate {
    id: ID!
    uuid: String!
    name: String!
    email: String!
    phone: String
    website_url: String
    social_profiles: Mixed
    bio: String
    profile_image_url: String
    affiliate_type: String!
    status: String!
    approval_date: DateTime
    rejection_reason: String
    commission_type: String!
    commission_rate: Float!
    min_payout_threshold: Float!
    payout_method: String!
    payout_frequency: String!
    unique_identifier: String!
    tracking_method: String!
    cookie_duration_days: Int!
    attribution_window_days: Int!
    total_clicks: Int!
    total_conversions: Int!
    total_commission_earned: Float!
    total_commission_paid: Float!
    banking_details: Mixed
    paypal_details: Mixed
    stripe_details: Mixed
    configuration: Mixed
    last_payout_date: DateTime
    last_activity_at: DateTime
    company: Company! @belongsTo
    program: AffiliateProgram! @belongsTo(relation: "program")
    tier: AffiliateTier @belongsTo(relation: "tier")
    links: [AffiliateLink!] @hasMany(relation: "links")
    conversions: [AffiliateConversion!] @hasMany(relation: "conversions")
    payouts: [AffiliateCommissionPayout!] @hasMany(relation: "payouts")
    created_at: DateTime!
    updated_at: DateTime
}

type AffiliateLink {
    id: ID!
    uuid: String!
    name: String
    description: String
    custom_slug: String
    short_code: String!
    destination_url: String
    link_type: String!
    config: Mixed
    tracking_method: String!
    cookie_duration_days: Int!
    attribution_window_days: Int!
    attribution_model: String!
    override_commission: Boolean!
    commission_type: String
    commission_rate: Float
    commission_note: String
    impression_count: Int!
    click_count: Int!
    conversion_count: Int!
    total_order_value: Float!
    total_commission: Float!
    is_active: Boolean!
    is_approved: Boolean!
    approval_notes: String
    configuration: Mixed
    affiliate: Affiliate! @belongsTo(relation: "affiliate")
    conversions: [AffiliateConversion!] @hasMany(relation: "conversions")
    created_at: DateTime!
    updated_at: DateTime
}

type AffiliateConversion {
    id: ID!
    uuid: String!
    affiliate: Affiliate! @belongsTo(relation: "affiliate")
    link: AffiliateLink @belongsTo(relation: "link")
    order: Order @belongsTo(relation: "order")
    payout: AffiliateCommissionPayout @belongsTo(relation: "payout")
    attribution_model: String!
    confirmed: Boolean!
    confirmed_at: String
    order_total: Money!
    eligible_amount: Money!
    commission_type: String!
    commission_rate: Money!
    commission_amount: Money!
    status: String!
    dispute_reason: String
    dispute_resolved_at: String
    notes: Mixed
    converted_at: String
    created_at: DateTime!
    updated_at: DateTime
}

type AffiliateCommissionPayout {
    id: ID!
    uuid: String!
    period_start: String!
    period_end: String!
    total_conversions: Int!
    total_order_value: Float!
    gross_commission: Float!
    fees: Float!
    adjustments: Float!
    net_commission: Float!
    payout_status: String!
    payout_method: String
    payout_reference: String
    payout_date: String
    approved_at: DateTime
    approved_by: Int
    approval_notes: String
    transaction_id: Int
    payment_intent_id: String
    failure_reason: String
    retry_count: Int!
    next_retry_at: DateTime
    configuration: Mixed
    affiliate: Affiliate! @belongsTo(relation: "affiliate")
    conversions: [AffiliateConversion!] @hasMany(relation: "conversions")
    created_at: DateTime!
    updated_at: DateTime
}

