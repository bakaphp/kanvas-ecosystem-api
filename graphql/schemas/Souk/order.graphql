enum ExportFormat {
    EXCEL
    PDF
}

type OrderExportResult {
    status: String!
    download_url: String
    file_name: String
    message: Mixed
}

type Order {
    id: ID!
    uuid: String!
    tracking_client_id: String
    user_email: String
    user_phone: String
    token: String
    billing_address_id: Int
    shipping_address_id: Int
    order_number: Int @method(name: "getOrderNumber")
    user_id: Int @deprecated(reason: "Use user field instead")
    user: User! @belongsTo
    people: People! @belongsTo
    company: Company! @belongsTo
    total_gross_amount: Float
    total_net_amount: Float
    shipping_price_gross_amount: Money!
    shipping_price_net_amount: Money!
    discount_amount: Money!
    tax_amount: Money!
    discount_name: String
    voucher_id: Int
    language_code: String
    status: String
    fulfillment_status: String
    shipping_method_name: String
    shipping_method_id: Int
    display_gross_prices: Boolean
    translated_discount_name: String
    customer_note: String
    weight: Money
    checkout_token: String
    message: [Message] @hasMany(relation: "getIntegrationMessage")
    currency: String
    metadata: Mixed
    reference: String
    private_metadata: Mixed
    is_deleted: Boolean!
    created_at: String!
    updated_at: String
    order_type: OrderType @belongsTo(relation: "orderType")
    parent: Order @belongsTo(relation: "parent")
    order_status: OrderStatus @belongsTo(relation: "orderStatus")
    payment_status: String
    payments: [Payment!] @hasMany(relation: "payments")
    discount_codes: [OrderDiscountRelation] @hasMany(relation: "orderDiscountCodes")
    transaction_link: String!
        @field(
            resolver: "App\\GraphQL\\Souk\\Builders\\Order\\TransactionLinkBuilder@getLink"
        )
    items(includeAllItems: Boolean = false): [OrderItem!]
        @HasMany(relation: "allItems")
        @builder(
            method: "App\\GraphQL\\Souk\\Builders\\Order\\OrderBuilder@filterByItems"
        )
    shipping_address: Address @belongsTo(relation: "shippingAddress")
    custom_fields: [CustomField!]!
        @paginate(
            defaultCount: 25
            resolver: "App\\GraphQL\\Ecosystem\\Queries\\CustomFields\\CustomFieldQuery@getAllByGraphType"
        )
    tags: [Tag!]
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Social\\Queries\\Tags\\TagsQueries@getTagsBuilder"
        )
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
}

type OrderItem {
    id: ID!
    uuid: String!
    product_name: String!
    product_sku: String!
    quantity: Float!
    unit_price_net_amount: Money!
    unit_price_gross_amount: Money!
    is_shipping_required: Boolean
    quantity_fulfilled: Float
    variant: Variant! @belongsTo
    tax_rate: Money!
    translated_product_name: String
    currency: String
    translated_variant_name: String
    variant_name: String!
    is_deleted: Boolean!
    created_at: String!
    updated_at: String
}

type OrderType {
    id: ID!
    name: String!
    created_at: String
    updated_at: String
}

type OrderStatus {
    id: ID!
    name: String!
    slug: String!
    order_type_id: ID!
    order_type: OrderType! @belongsTo(relation: "orderType")
    is_default: Boolean!
    is_final: Boolean!
    metadata: Mixed
}

type PaymentResult {
    status: String!
    transaction_id: ID!
    order_status: String
    message: Mixed
}

type OrderItemImport {
    variant_id: Int
    quantity: Float
}

type ImportOrderCsvResult {
    status: String!
    message: Mixed
}

type GeneratePaymentIntentResult {
    id: ID!
    client_secret: String!
    status: String
    message: Mixed
}

type OrderResult {
    order: Order
    message: Mixed
}

input CreditCardInput {
    name: String!
    number: String!
    exp_month: Int!
    exp_year: Int!
    cvv: Int!
}

input OrderBillingInput {
    address: String!
    address2: String
    city: String!
    state: String!
    zip: String!
    country: String!
}

input CartOrderInput {
    cartId: ID!
    email: String!
    customer: PeopleInput!
    billing: OrderBillingInput!
    address: AddressInput
    note: String
}

input OrderInput {
    cartId: ID!
    payment: CreditCardInput!
    billing: OrderBillingInput
}

input OrderCustomerInput {
    email: String!
    phone: String
    note: String
}

input OrderCartInput {
    cartId: ID!
    parent_id: ID
    customer: OrderCustomerInput!
    currency: String
    billing: OrderBillingInput
    shipping_address: AddressInput
    items: [OrderLineItemInput]
    order_type: String
    metadata: Mixed
    reference: String
    payment_intent_id: ID
}

input ExtendOrderInput {
    customer: OrderCustomerInput!
    billing: OrderBillingInput
    currency: String
    shipping_address: AddressInput
    items: [OrderLineItemInput]
    order_type: String
    metadata: Mixed
    reference: String
}

input UpdateOrderInput {
    items: [OrderLineItemInput]
    fulfillment_status: String
    metadata: Mixed
}

input DraftOrderInput {
    email: String!
    phone: String
    customer: PeopleInput!
    region_id: ID!
    billing_address: OrderBillingInput
    shipping_address: AddressInput
    items: [OrderLineItemInput!]!
    note: String
    metadata: Mixed
}

input OrderLineItemInput {
    variant_id: ID!
    quantity: Float!
    price: Money
    metadata: Mixed
}

input PaymentInput {
    orderId: ID!
    paymentMethod: String!
    creditCard: CreditCardInput
    billing: OrderBillingInput
}

input ProcessPaymentInput {
    order_id: ID!
    payment_token: String! # Token from the payment provider (e.g., Stripe's paymentMethodId)
    payment_provider: String! # e.g., "stripe", "paypal"
}

input ImportOrderCsvInput {
    file: Upload!
    channel_id: ID!
}

input AppleInAppPurchaseReceipt {
    product_id: ID!
    transaction_id: String!
    receipt: String!
    transaction_date: Mixed!
    region_id: ID
    custom_fields: [CustomFieldEntityInput!]
}

input GooglePlayInAppPurchaseReceipt {
    product_id: ID!
    order_id: String!
    purchase_token: String!
    region_id: ID
    custom_fields: [CustomFieldEntityInput!]
}

type PaymentLinkResult {
    status: String!
    payment_url: String
    payment_link_id: String
    session_id: String
    provider: String
    message: Mixed
}

input PaymentLinkOptionsInput {
    success_url: String
    cancel_url: String
    automatic_tax: Boolean = false
    allowed_countries: [String!]
    payment_method_types: [String!] = ["card"]
    use_detailed_items: Boolean = false
    custom_fields: [PaymentCustomFieldInput!]
    provider: String = "stripe"
}

input PaymentCustomFieldInput {
    key: String!
    type: String! # "text", "dropdown", "numeric"
    label: String!
    optional: Boolean = true
    dropdown_options: [String!]
}

input TransitionOrderStatusInput {
    order_id: ID!
    status_slug: String!
    date: String
}

type OrderStatusTransitionResult {
    status: String!
    message: Mixed
}

type OrderTransitionHistory {
    id: ID!
    order_id: ID!
    order: Order @belongsTo(relation: "order")
    fromStatus: OrderStatus @belongsTo(relation: "fromStatus")
    toStatus: OrderStatus @belongsTo(relation: "toStatus")
    changedBy: User @belongsTo(relation: "changedBy")
    endedBy: User @belongsTo(relation: "endedBy")
    description: String
    metadata: String
    is_current: Boolean
    changed_at: String
    ended_at: String
    duration_in_seconds: Int
}

input ExportMetadataInput {
    custom_title: String
    subtitle: String
    headerImages: [String!]
    dateField: String
}

extend type Mutation @guard {
    # @deprecated(reason: "Use createOrderFromCart instead")
    createOrder(input: OrderInput!): Mixed!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@create"
        )
    createOrderFromCart(input: OrderCartInput!): OrderResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@createFromCart"
        )
    createOrderFromWalletCart(input: OrderCartInput!): OrderResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@createOrderFromWalletCart"
        )
    createDraftOrder(input: DraftOrderInput!): Order!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\DraftOrderManagementMutation@create"
        )
    updateOrder(id: ID!, input: UpdateOrderInput!): OrderResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@update"
        )
    extendOrder(id: ID!, input: ExtendOrderInput!): OrderResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@extendOrder"
        )
    deleteOrder(id: ID!): Boolean
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@delete"
        )
    createOrderFromAppleInAppPurchase(
        input: AppleInAppPurchaseReceipt!
    ): Order!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\AppleInAppPurchaseMutation@create"
        )
    createOrderFromGooglePlayInAppPurchase(
        input: GooglePlayInAppPurchaseReceipt!
    ): Order!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\GooglePlayInAppPurchaseMutation@create"
        )
    processOrderPayment(input: ProcessPaymentInput!): PaymentResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\PaymentManagementMutation@processPayment"
        )
    importOrderCsv(input: ImportOrderCsvInput!): ImportOrderCsvResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\ImportOrderCsvMutation@create"
        )
    generateOrderPaymentIntent(amount: Money!): GeneratePaymentIntentResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\PaymentManagementMutation@generatePaymentIntent"
        )
    #createOrderFromCart(input: CartOrderInput!): Mixed!
    #    @field(
    #        resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@create"
    #    )
    #assignPaymentToOrder(input: PaymentInput!): Mixed!
    #    @field(
    #        resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@assignPaymentToOrder"
    #    )
    transitionOrderStatus(
        input: TransitionOrderStatusInput!
    ): OrderStatusTransitionResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderManagementMutation@transitionOrderStatus"
        )
}

extend type Mutation @guardByAppKey {
    generateCheckoutSession(
        order_id: ID!
        options: PaymentLinkOptionsInput
    ): PaymentLinkResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\PaymentLinkMutation@generateCheckoutSession"
        )
    sendOrderEmail(order_id: ID!, template: String): Boolean!
        @field(
            resolver: "App\\GraphQL\\Souk\\Mutations\\Orders\\OrderEmailMutation@sendOrderEmail"
        )
}

extend type Query @guard {
    orders(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "companies_id"
                    "users_id"
                    "user_email"
                    "user_phone"
                    "people_id"
                    "status"
                    "fulfillment_status"
                    "order_number"
                    "reference"
                    "order_types_id"
                    "parent_id"
                    "created_at"
                    "updated_at"
                    "token"
                ]
            )
        orderType: _
            @whereConditions(
                columns: ["name"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderTypeHandler"
            )
        orderStatus: _
            @whereConditions(
                columns: ["name", "slug", "order_type_id", "id"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderStatusHandler"
            )
        hasAddress: _
            @whereConditions(
                columns: [
                    "address"
                    "address_2"
                    "city"
                    "county"
                    "state"
                    "zip"
                    "countries_id"
                ]
                handler: "App\\GraphQL\\Souk\\Handlers\\HasAddressHandler"
            )
        hasItems: _
            @whereHasConditions(
                relation: "allItems"
                columns: ["product_name", "product_sku", "variant_id"]
            )
        hasPeople: _
            @whereHasConditions(
                handler: "App\\GraphQL\\Souk\\Handlers\\HasPeopleHandler"
                columns: [
                    "id"
                    "users_id"
                    "name"
                    "firstname"
                    "middlename"
                    "lastname"
                    "dob"
                ]
            )
        orderBy: _
            @orderBy(columns: ["id", "created_at", "updated_at", "status"])
    ): [Order!]!
        @paginate(
            model: "Kanvas\\Souk\\Orders\\Models\\Order"
            scopes: ["fromCompany", "fromApp", "notDeleted", "filterByUser"]
            defaultCount: 25
        )

    orderTypes(
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
        where: _ @whereConditions(columns: ["id", "companies_id", "name"])
    ): [OrderType!]!
        @paginate(
            defaultCount: 25
            model: "Kanvas\\Souk\\Orders\\Models\\OrderTypes"
            scopes: ["fromApp", "notDeleted"]
        )
    orderTransitionHistory(
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "companies_id"
                    "order_id"
                    "transition_id"
                    "from_status_id"
                    "to_status_id"
                    "changed_at"
                    "ended_at"
                    "is_current"
                    "changed_by"
                    "ended_by"
                    "duration_in_seconds"
                ]
            )
    ): [OrderTransitionHistory!]!
        @paginate(
            defaultCount: 25
            model: "Kanvas\\Souk\\Orders\\Models\\OrderTransitionHistory"
            scopes: ["fromApp", "notDeleted"]
        )
    exportOrders(
        format: ExportFormat!
        search: String @search
        field_mapper: Mixed # JSON object with label => field_path mapping
        metadata: ExportMetadataInput
        timezone: String # e.g., "America/New_York"
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "companies_id"
                    "users_id"
                    "user_email"
                    "user_phone"
                    "status"
                    "fulfillment_status"
                    "order_number"
                    "reference"
                    "order_types_id"
                    "parent_id"
                    "created_at"
                    "updated_at"
                ]
            )
        orderType: _
            @whereConditions(
                columns: ["name"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderTypeHandler"
            )
        orderStatus: _
            @whereConditions(
                columns: ["name", "slug", "order_type_id", "id"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderStatusHandler"
            )
        hasAddress: _
            @whereConditions(
                columns: [
                    "address"
                    "address_2"
                    "city"
                    "county"
                    "state"
                    "zip"
                    "countries_id"
                ]
                handler: "App\\GraphQL\\Souk\\Handlers\\HasAddressHandler"
            )
        hasItems: _
            @whereHasConditions(
                relation: "allItems"
                columns: ["product_name", "product_sku", "variant_id"]
            )
        hasPeople: _
            @whereHasConditions(
                handler: "App\\GraphQL\\Souk\\Handlers\\HasPeopleHandler"
                columns: [
                    "id"
                    "users_id"
                    "name"
                    "firstname"
                    "middlename"
                    "lastname"
                    "dob"
                ]
            )
        orderBy: _
            @orderBy(columns: ["id", "created_at", "updated_at", "status"])
    ): OrderExportResult!
        @field(
            resolver: "App\\GraphQL\\Souk\\Queries\\Orders\\OrderExportQuery@export"
            # scopes: ["fromApp", "notDeleted"]
        )
}
