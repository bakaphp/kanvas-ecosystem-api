# Provider-agnostic insurance surface.
#
# Only two operations are direct: reference data to render the forms, and a price
# to compare. Contracting is an Order like any other Movipass vertical, and the
# insurer round-trips (documents, emission, policy sync) run as workflow activities
# off the order's status — so adding an insurer adds a container binding, never a
# mutation.
#
# Setup is done through the generic createIntegrationCompany mutation.

type InsuranceQuoteResult {
    provider: String!
    product: String!
    success: Boolean!
    message: String!
    quote_number: String!
    premium: Float
    "Usage-based products only: rate per kilometer driven, billed on top of the premium."
    rate_per_km: Float
    tax: Float
    total: Float
    currency: String
    "What the intermediary earns on this policy, when the insurer publishes it at quote time."
    commission: Float
    "The insurer's own verdict that this quote can become a policy. Null means they do not say."
    can_emit: Boolean
    "The insurer's inspection state for this quote, in their own words."
    inspection_status: String
    data: Mixed
}

extend type Query @guard {
    insuranceCatalog(catalog: String!, params: Mixed, provider: String): Mixed
        @field(
            resolver: "App\\GraphQL\\Insurance\\Queries\\InsuranceQuery@catalog"
        )
    insuranceQuote(
        product: String!
        input: Mixed!
        provider: String
    ): InsuranceQuoteResult!
        @field(
            resolver: "App\\GraphQL\\Insurance\\Queries\\InsuranceQuery@quote"
        )
}

enum InsuranceVehicleFuelType {
    GAS @enum(value: "gas")
    GASOLINE_DIESEL @enum(value: "gasoline_diesel")
    ELECTRIC @enum(value: "electric")
}

enum InsuranceSearchFailureReason {
    REJECTED @enum(value: "rejected")
    UNAVAILABLE @enum(value: "unavailable")
    TIMEOUT @enum(value: "timeout")
    INCOMPLETE_INFORMATION @enum(value: "incomplete_information")
}

input InsuranceVehicleInput {
    product_id: ID
    brand: String
    model: String
    version: String
    year: Int
    fuel_type: InsuranceVehicleFuelType
    is_zero_km: Boolean
    estimated_value: Float
}

input InsuranceUnderwritingInput {
    ip_address: String
    birth_date: String
    age: Int
    marital_status: String
    sex: String
    usage: String
    circulation_zone: String
}

input CanonicalQuoteInput {
    category: InsuranceCoverageCategory!
    vehicle: InsuranceVehicleInput!
    underwriting: InsuranceUnderwritingInput
}

type InsuranceSearchInsurer {
    id: ID!
    name: String!
    logo: String
}

type InsuranceSearchPlan {
    id: ID!
    name: String!
    slug: String!
    type: InsuranceCoverageCategory!
    deductible: Float
    validity_days: Int
}

type InsuranceSearchEntry {
    rank: Int!
    insurer: InsuranceSearchInsurer!
    plan: InsuranceSearchPlan!
    quote_number: String!
    price: Float
    premium: Float
    tax: Float
    total: Float
    currency: String
    can_emit: Boolean
    inspection_status: String
    is_sponsored: Boolean!
    is_recommended: Boolean!
}

type InsuranceSearchFailure {
    insurer: InsuranceSearchInsurer!
    reason: InsuranceSearchFailureReason!
    message: String!
}

type InsuranceSearchResult {
    entries: [InsuranceSearchEntry!]!
    failures: [InsuranceSearchFailure!]!
}

input SelectInsurancePlanInput {
    plan_id: ID!
    quote_number: String!
}

input InsuranceCustomerInput {
    first_name: String
    last_name: String
    email: String
    phone: String
    birth_date: String
    sex: String
    marital_status: String
    document_type: String
    document_number: String
    nationality: String
    occupation: String
    country_of_residence: String
}

input ContractInsurancePlanInput {
    lead_id: ID!
    customer: InsuranceCustomerInput
}

extend type Query @guard {
    insuranceSearch(input: CanonicalQuoteInput!): InsuranceSearchResult!
        @field(
            resolver: "App\\GraphQL\\Insurance\\Queries\\InsuranceQuery@search"
        )
}

extend type Mutation @guard {
    selectInsurancePlan(input: SelectInsurancePlanInput!): Lead!
        @field(
            resolver: "App\\GraphQL\\Insurance\\Mutations\\InsuranceSelectionMutation@select"
        )
    contractInsurancePlan(input: ContractInsurancePlanInput!): Order!
        @field(
            resolver: "App\\GraphQL\\Insurance\\Mutations\\InsuranceSelectionMutation@contract"
        )
}
