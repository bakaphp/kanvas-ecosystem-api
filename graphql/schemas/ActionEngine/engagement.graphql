type Engagement {
    id: ID!
    uuid: String!
    user: User! @belongsTo(relation: "user")
    company: Company! @belongsTo(relation: "company")
    company_action: CompanyAction! @belongsTo(relation: "companyAction")
    message: Message @belongsTo(relation: "message")
    lead: Lead @belongsTo(relation: "lead")
    people: People @belongsTo(relation: "people")
    stage: ActionPipelineStage @belongsTo(relation: "stage")
    parent: Engagement @belongsTo(relation: "parent")
    children: [Engagement!] @hasMany(relation: "children")
    stage_history: [Engagement!]!
        @field(resolver: "App\\GraphQL\\ActionEngine\\Queries\\Engagements\\EngagementQuery@stageHistory")
    entity_uuid: String!
    slug: String!
    is_complete: Boolean!
        @field(resolver: "App\\GraphQL\\ActionEngine\\Queries\\Engagements\\EngagementQuery@isComplete")
    completion_progress: EngagementCompletionProgress!
        @field(resolver: "App\\GraphQL\\ActionEngine\\Queries\\Engagements\\EngagementQuery@completionProgress")
}

type EngagementCompletionProgress {
    completed: Int!
    total: Int!
}

enum EngagementEntityType {
    LEAD
    PEOPLE
}

input EngagementFilterInput {
    entity_type: EngagementEntityType!
    entity_id: ID!
    slug: String!
    status: String!
}

input UpdateEngagementInput {
    status: String
    data: Mixed!
    description: String
    via: String
}

input CreateEngagementInput {
    lead_id: ID!
    request_id: ID!
    people_id: ID
    receiver_id: ID
    task_id: ID
    parent_id: ID
    action: String!
    data: Mixed
    source: String!
    status: String!
    description: String
    via: String
}

extend type Mutation @guard {
    startLeadEngagement(input: CreateEngagementInput!): Engagement!
        @field(
            resolver: "App\\GraphQL\\ActionEngine\\Mutations\\Engagements\\EngagementMutation@startEngagement"
        )
    continueLeadEngagement(input: CreateEngagementInput!): Engagement!
        @field(
            resolver: "App\\GraphQL\\ActionEngine\\Mutations\\Engagements\\EngagementMutation@continueEngagement"
        )
    updateEngagement(uuid: ID!, input: UpdateEngagementInput!): Engagement!
        @field(
            resolver: "App\\GraphQL\\ActionEngine\\Mutations\\Engagements\\EngagementMutation@update"
        )
}

# Query definition
extend type Query @guard {
    engagements(
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "parent_id"
                    "companies_id"
                    "companies_actions_id"
                    "message_id"
                    "leads_id"
                    "people_id"
                    "pipelines_stages_id"
                    "entity_uuid"
                    "slug"
                ]
            )

        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "slug"
                    "pipelines_stages_id"
                ]
            )
    ): [Engagement!]!
        @paginate(
            model: "Kanvas\\ActionEngine\\Engagements\\Models\\Engagement"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 25
        )

    engagementByFilter(filter: EngagementFilterInput!): Engagement
        @field(
            resolver: "App\\GraphQL\\ActionEngine\\Queries\\Engagements\\EngagementQuery@engagementByFilter"
        )
}
