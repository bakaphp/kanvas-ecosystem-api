type Engagement {
    id: ID!
    uuid: String!
    user: User! @belongsTo
    company_action: CompanyAction! @belongsTo(relation: "companyAction")
    message: Message @belongsTo
    lead: Lead @belongsTo
    people: People @belongsTo
    entity_uuid: String!
    slug: String!
}

enum EngagementEntityType {
    LEAD
    PEOPLE
}

input EngagementFilterInput {
    entity_type: EngagementEntityType!
    entity_id: ID!
    slug: String!
    status: String!
}

input CreateEngagementInput {
    lead_id: ID!
    request_id: ID!
    people_id: ID
    receiver_id: ID
    task_id: ID
    action: String!
    data: Mixed
    source: String!
    status: String!
    description: String
    via: String
}

extend type Mutation @guard {
    startLeadEngagement(input: CreateEngagementInput!): Engagement!
        @field(
            resolver: "App\\GraphQL\\ActionEngine\\Mutations\\Engagements\\EngagementMutation@startEngagement"
        )
    continueLeadEngagement(input: CreateEngagementInput!): Engagement!
        @field(
            resolver: "App\\GraphQL\\ActionEngine\\Mutations\\Engagements\\EngagementMutation@continueEngagement"
        )
}

# Query definition
extend type Query @guard {
    engagements(
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "companies_id"
                    "companies_actions_id"
                    "message_id"
                    "leads_id"
                    "people_id"
                    "pipelines_stages_id"
                    "entity_uuid"
                    "slug"
                ]
            )

        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "slug"
                    "pipelines_stages_id"
                ]
            )
    ): [Engagement!]!
        @paginate(
            model: "Kanvas\\ActionEngine\\Engagements\\Models\\Engagement"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 25
        )

    engagementByFilter(filter: EngagementFilterInput!): Engagement
        @field(
            resolver: "App\\GraphQL\\ActionEngine\\Queries\\Engagements\\EngagementQuery@engagementByFilter"
        )
}
