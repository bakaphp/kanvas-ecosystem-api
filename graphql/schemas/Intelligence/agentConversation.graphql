union AgentConversationParticipant
    @union(resolveType: "App\\GraphQL\\Intelligence\\Types\\AgentConversationParticipantTypeResolver")
    = User
    | People
    | AgentAi

type AgentConversation {
    id: ID!
    agent: AgentAi @belongsTo(relation: "agent")
    user: User @belongsTo(relation: "user")
    participant: AgentConversationParticipant @morphTo(relation: "participant")
    title: String!
    meta: Mixed
    """
    The chat as the person sees it. Compaction summaries and tool rounds are left out unless
    include_internal is true, which is the backend view of what the agent did.
    """
    messages(
        include_internal: Boolean = false @scope(name: "withInternal")
        where: _ @whereConditions(columns: ["created_at", "status", "role"])
        orderBy: _ @orderBy(columns: ["created_at", "updated_at", "id"])
    ): [AgentConversationMessage!]!
        @hasMany(relation: "messages", type: PAGINATOR, defaultCount: 50)
    created_at: DateTime!
    updated_at: DateTime!
}

type AgentConversationMessage {
    id: ID!
    conversation: AgentConversation! @belongsTo(relation: "conversation")
    user: User @belongsTo(relation: "user")
    participant: AgentConversationParticipant @morphTo(relation: "participant")
    agent: String!
    role: String!
    status: String!
    is_public: Boolean!
    """
    null for a conversational turn; `summary`, `tool_call` or `tool_call_result` for the rows the person's chat leaves out.
    """
    kind: String
    content: String
    attachments: Mixed
    tool_calls: Mixed @deprecated(reason: "Derived from steps; read steps.tool_calls, each call carries its result.")
    tool_results: Mixed @deprecated(reason: "Derived from steps; read steps.tool_calls, each call carries its result.")
    steps: Mixed
    usage: Mixed
    meta: Mixed
    created_at: DateTime!
    updated_at: DateTime!
}

extend type Query @guard {
    agentConversations(
        agent_id: ID @eq
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "user_id"
                    "agent_id"
                    "participant_type"
                    "participant_id"
                    "title"
                    "created_at"
                    "updated_at"
                ]
            )
        orderBy: _ @orderBy(columns: ["created_at", "updated_at"])
    ): [AgentConversation!]!
        @paginate(
            model: "Kanvas\\Intelligence\\Agents\\Models\\AgentConversation"
            defaultCount: 25
            scopes: ["fromApp", "fromCompany", "linkedToAgent", "fromUser"]
        )
}
