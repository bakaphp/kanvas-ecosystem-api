type FollowUp {
    id: ID!
    pipeline: LeadPipeline! @belongsTo(relation: "pipeline")
    days: [FollowUpDay!]! @hasMany(relation: "days")
    name: String!
    follow_up_type: Int!
    config: Mixed
    is_deleted: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type FollowUpDay {
    id: ID!
    followUp: FollowUp! @belongsTo(relation: "followUp")
    pipelineStage: LeadPipelineStage! @belongsTo(relation: "pipelineStage")
    templates: [FollowUpTemplate!]! @hasMany(relation: "templates")
    name: String!
    time_value: Int!
    time_unit: String
    weight: Int!
    calendar_day: Boolean!
    move_to_stage_id: Int
    send_message: Boolean!
    is_deleted: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type FollowUpTemplate {
    id: ID!
    followUpDay: FollowUpDay! @belongsTo(relation: "followUpDay")
    communication_channel: String!
    name: String!
    template: String!
    is_deleted: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

input FollowUpInput {
    pipeline_id: ID!
    name: String!
    follow_up_type: Int!
    config: Mixed
}

input UpdateFollowUpInput {
    pipeline_id: ID
    name: String
    follow_up_type: Int
    config: Mixed
}

input FollowUpDayInput {
    follow_up_id: ID!
    pipeline_stage_id: ID!
    name: String!
    time_value: Int!
    time_unit: String
    weight: Int!
    calendar_day: Boolean
    move_to_stage_id: Int
    send_message: Boolean
}

input UpdateFollowUpDayInput {
    pipeline_stage_id: ID
    name: String
    time_value: Int
    time_unit: String
    weight: Int
    calendar_day: Boolean
    move_to_stage_id: Int
    send_message: Boolean
}

input FollowUpTemplateInput {
    follow_up_day_id: ID!
    communication_channel: String!
    name: String!
    template: String!
}

input UpdateFollowUpTemplateInput {
    communication_channel: String
    name: String
    template: String
}

"Discrete outcome kinds for a followUpLead trigger. Mirrors FollowUpOutcomeKindEnum."
enum FollowUpLeadOutcomeKind {
    SENT @enum(value: "sent")
    SKIPPED @enum(value: "skipped")
    EXHAUSTED @enum(value: "exhausted")
    COMPLETED @enum(value: "completed")
    ERROR @enum(value: "error")
}

"Outcome of a manual followUpLead trigger. Mirrors the FollowUpOutcome DTO."
type FollowUpLeadOutcome {
    kind: FollowUpLeadOutcomeKind!
    reason: String
    message: String
}

