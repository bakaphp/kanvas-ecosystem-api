type AIAgentSession {
    name: String
    user: Mixed!
    id: ID!
    uuid: ID
    canal_id: String!
    company: Company!
    company_config: Mixed
    content: Mixed
    channel: String
    system_modules_id: ID
    channel_slugs: [String!]!
}

extend type Query @guard {
    aiAgentSession(id: ID!): AIAgentSession!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\AgentSessionQuery@getSessionInfo"
        )
}
