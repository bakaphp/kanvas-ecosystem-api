type VoiceAgentSpec {
    agent_id: String!
    version: String!
    language: String
    prompts: VoiceAgentPrompts!
    models: VoiceAgentModels!
    telephony: VoiceAgentTelephony
    context_schema: [VoiceAgentContextField!]!
    tools: [VoiceAgentTool!]!
}

type VoiceAgentPrompts {
    system_instruction: String!
    greeting: String
    voicemail_message: String
}

type VoiceAgentModels {
    stt: VoiceAgentSttModel
    llm: VoiceAgentLlmModel!
    tts: VoiceAgentTtsModel
}

type VoiceAgentSttModel {
    provider: String
    model: String
    language: String
}

type VoiceAgentLlmModel {
    "Kanvas LLM provider (gemini, openai, openai_like, …); google when the agent has no voice LLM config."
    provider: String
    model: String
    "OpenAI-compatible endpoint (e.g. OpenRouter) from the voice LLM config, when it sets one."
    base_url: String
}

type VoiceAgentTtsModel {
    provider: String
    voice_id: String
    model: String
    stability: Float
    similarity: Float
    style: Float
    speed: Float
    use_speaker_boost: Boolean
}

type VoiceAgentTelephony {
    from_number: String
}

type VoiceAgentContextField {
    key: String!
    required: Boolean
    default: String
}

type VoiceAgentTool {
    name: String!
    description: String
    "JSON Schema for the tool's arguments: { type, properties, required }."
    parameters: Mixed
}

"The voice agent's company Twilio account, for the runtime to place and end that company's calls."
type VoiceAgentTwilio {
    account_sid: String!
    auth_token: String!
}

type VoiceAgentByNumber {
    agent_id: String!
}

type VoiceAgentLeadContext {
    lead_id: Int
    name: String
    status: String
    stage: String
    owner: String
    vehicle_interest: String
    context_info: String
    "True when we already know this number (has a lead, or a prior contact)."
    is_returning: Boolean
    "Short natural-language block (who + recent history) for the LLM."
    summary: String
}

extend type Query @guardByAppKey {
    voiceAgentSpec(uuid: String!): VoiceAgentSpec!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\Agent\\VoiceAgentSpecQuery"
        )
    "The agent's company Twilio credentials. Besides the app key, needs the runtime's token in X-Voice-Runtime-Token."
    voiceAgentTwilio(agent_uuid: String!): VoiceAgentTwilio!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\Agent\\VoiceAgentTwilioQuery"
        )
    "Inbound routing: which agent owns this dialed number? Null if none."
    voiceAgentByNumber(phone_number: String!): VoiceAgentByNumber
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\Agent\\VoiceAgentByNumberQuery"
        )
    "Outbound: resolve the lead for a dialed number and return compact context. Null if none."
    voiceAgentLeadContext(
        agent_uuid: String!
        phone: String!
    ): VoiceAgentLeadContext
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\Agent\\VoiceAgentLeadContextQuery"
        )
}

extend type Mutation @guardByAppKey {
    "Data plane: execute one of an agent's tools (called by the voice runtime on an LLM function call). Returns the tool's JSON result."
    runVoiceAgentTool(
        agent_uuid: String!
        tool_name: String!
        arguments: Mixed
    ): Mixed
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\VoiceAgentToolMutation@run"
        )
    "Data plane: capture the caller behind a phone as a contact, promoting to a lead on repeat or clear intent (outbound requires intent). Phone/direction come from the runtime, not the LLM."
    captureVoiceLead(
        agent_uuid: String!
        phone: String!
        name: String
        interest: String
        interested: Boolean
        direction: String
        summary: String
        wants_appointment: Boolean
        appointment_preference: String
    ): Mixed
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\VoiceAgentCallerMutation@capture"
        )
}
