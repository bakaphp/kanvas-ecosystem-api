type LedgerEvent {
    id: ID!
    uuid: String!
    company: Company! @belongsTo(relation: "company")
    source_domain: String!
    source_entity_type: String
    source_entity_id: Int
    event_type: String!
    actor_type: String
    actor_id: Int
    status: String!
    category: NervousSystemEventCategory
    payload: Mixed
    payload_schema_version: Int!
    result: Mixed
    error: Mixed
    duration_ms: Int
    correlation_id: String
    causation_id: String
    occurred_at: DateTime!
    indexed_at: DateTime!
}

"Pulse-stream classification. Internal events (rollups, wake dispatches) return null."
enum NervousSystemEventCategory {
    SIGNAL
    UNDERSTAND
    DECIDE
    ACT
    WARNING
}

type NervousSystemHealth {
    writes_per_second: Float!
    queue_lag_seconds: Int!
    queue_depth: Int!
    dead_letter_count: Int!
    last_archive_at: DateTime
    archive_lag_hours: Int!
    hot_event_count: Int!
    archived_event_count: Int!
    sampled_redis_dedupe_keys: Int!
}

extend type Query @guard {
    ledgerEvents(
        where: _
            @whereConditions(
                columns: [
                    "source_domain"
                    "event_type"
                    "source_entity_type"
                    "source_entity_id"
                    "status"
                    "category"
                    "correlation_id"
                    "causation_id"
                    "actor_type"
                    "actor_id"
                    "occurred_at"
                ]
            )
        orderBy: _ @orderBy(columns: ["id", "occurred_at", "indexed_at"])
    ): [LedgerEvent!]!
        @paginate(
            model: "Kanvas\\NervousSystem\\Ledger\\Models\\Event"
            scopes: ["fromApp", "fromCompany", "recent"]
            defaultCount: 50
        )

    nervousSystemHealth: NervousSystemHealth!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\NervousSystem\\NervousSystemHealthQuery@get"
        )
}
