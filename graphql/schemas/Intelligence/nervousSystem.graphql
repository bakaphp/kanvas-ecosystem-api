type LedgerEvent {
    id: ID!
    uuid: String!
    company: Company! @belongsTo(relation: "company")
    source_domain: String!
    source_entity_type: String
    source_entity_id: Int
    event_type: String!
    actor_type: String
    actor_id: Int
    status: String!
    payload: Mixed
    result: Mixed
    error: Mixed
    duration_ms: Int
    correlation_id: String
    occurred_at: DateTime!
    indexed_at: DateTime!
    is_archived: Boolean!
}

extend type Query @guardByAdmin {
    ledgerEvents(
        where: _
            @whereConditions(
                columns: [
                    "source_domain"
                    "event_type"
                    "source_entity_type"
                    "source_entity_id"
                    "status"
                    "correlation_id"
                    "actor_type"
                    "actor_id"
                ]
            )
        orderBy: _ @orderBy(columns: ["id", "occurred_at", "indexed_at"])
    ): [LedgerEvent!]!
        @paginate(
            model: "Kanvas\\NervousSystem\\Ledger\\Models\\Event"
            scopes: ["fromApp", "fromCompany", "notArchived", "recent"]
            defaultCount: 50
        )
}
