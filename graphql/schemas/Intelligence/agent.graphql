type AgentAi {
    id: ID!
    company: [Company!]! @belongsTo
    user: [User!]! @belongsTo
    type: agentType! @belongsTo
    model: AgentAiModel @belongsTo
    companyTaskList: TaskList @belongsTo
    parent: AgentAi @belongsTo(relation: "parent")
    children: [AgentAi!]! @hasMany(relation: "children")
    swarms: [AgentSwarm!]! @belongsToMany
    uuid: String!
    name: String!
    description: String
    config: Mixed
    role: Mixed
    soul: String
    instructions: String
    output_format: String
    identity: Mixed
    user_context: String
    tools_config: String
    deployment_status: String!
    agent_model_id: ID
    parent_id: ID
    is_active: Boolean!
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
    created_at: DateTime!
    updated_at: DateTime!
}

type AgentAiModel {
    id: ID!
    name: String!
    config: JSON
    is_active: Boolean!
    is_published: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

input AgentAiInput {
    agent_type_id: Int!
    name: String!
    agent_model_id: Int
    description: String
    config: Mixed!
    role: Mixed!
    soul: String
    instructions: String
    output_format: String
    identity: Mixed
    user_context: String
    tools_config: String
    parent_agent_id: ID
    is_active: Boolean!
    company_task_list_id: Int
    communication_channels: [CommunicationChannelPivot!]
    swarm_ids: [ID!]
}

input CommunicationChannelPivot {
    communication_channel_id: Int!
    entry_point: String
    config: String
}

input ChatSimpleInput {
    agent_id: ID!
    session_id: String!
    message: String!
}

input AgentSessionInput {
    agent_id: ID!
    canal_id: String!
    lead_id: ID!
}

extend type Mutation @guard {
    createAiAgent(input: AgentAiInput!): AgentAi!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentManagementMutation@create"
        )
    updateAiAgent(id: ID!, input: AgentAiInput!): AgentAi!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentManagementMutation@update"
        )
    deleteAiAgent(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentManagementMutation@delete"
        )
    aiAgentCreateSession(input: AgentSessionInput!): String!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentChatMutation@createSession"
        )
    aiAgentChat(input: ChatSimpleInput!): String!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentChatMutation@chat"
        )
}

extend type Query @guard {
    followUpPrompt(
        lead_id: ID!
        pipeline_stage_id: ID!
        session_id: String!
        message_template: String!
        day: Float!
    ): String!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\FollowUpPromptQuery@getFollowUpPrompt"
        )
    agentsAi(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "description"
                    "is_active"
                    "agent_type_id"
                    "company_task_list_id"
                ]
            )
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at"])
    ): [AgentAi!]!
        @paginate(
            model: "Kanvas\\Intelligence\\Agents\\Models\\Agent"
            defaultCount: 25
            scopes: ["fromCompany", "fromApp"]
        )
    agentModels(
        where: _
            @whereConditions(
                columns: ["id", "name", "is_active", "is_published"]
            )
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [AgentAiModel!]!
        @paginate(
            model: "Kanvas\\Intelligence\\Agents\\Models\\AgentModel"
            defaultCount: 25
            scopes: ["fromApp"]
        )
}

extend type Subscription @guard {
    agentChatResponse(agent_id: ID!, session_id: String!): JSON
        @subscription(
            class: "App\\GraphQL\\Intelligence\\Subscriptions\\AgentChatSubscription"
        )
}
