type AgentAi {
    id: ID!
    company: Company @belongsTo(relation: "company")
    user: User @belongsTo(relation: "user")
    creator: User @belongsTo(relation: "creator")
    type: agentType! @belongsTo(relation: "type")
    model: AgentAiModel @belongsTo(relation: "model")
    llmConfig: AgentLlmConfig @belongsTo(relation: "llmConfig")
    companyTaskList: TaskList @belongsTo(relation: "companyTaskList")
    parent: AgentAi @belongsTo(relation: "parent")
    children: [AgentAi!]! @hasMany(relation: "children")
    swarms: [AgentSwarm!]! @belongsToMany(relation: "swarms")
    uuid: String!
    name: String!
    description: String
    config: Mixed
    role: Mixed
    soul: String
    instructions: String
    output_format: String
    identity: Mixed
    user_context: String
    tools_config: String
    voice_config: Mixed
    deployment_status: String!
    activeDeployment: AgentDeploymentType @hasOne
    latestDeployment: AgentDeploymentType @hasOne
    agent_model_id: ID
    parent_id: ID
    is_active: Boolean!
    is_sub_agent: Boolean!
    selectedTools: [NervousSystemTool!]!
        @belongsToMany(relation: "selectedTools")
    kanvasModules: [AgentKanvasModule!]! @hasMany(relation: "kanvasModules")
    awake_state: String
    last_state_changed_at: DateTime
    latestDailyCycle: AgentDailyCycle @hasOne(relation: "latestDailyCycle")
    dailyCycles: [AgentDailyCycle!]! @hasMany(relation: "dailyCycles")
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
    custom_fields: [CustomField!]!
        @paginate(
            defaultCount: 25
            resolver: "App\\GraphQL\\Ecosystem\\Queries\\CustomFields\\CustomFieldQuery@getAllByGraphType"
        )
    monthly_usage: AgentMonthlyUsage!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\Agent\\AgentUsageQuery@monthlyUsage"
        )
    created_at: DateTime!
    updated_at: DateTime!
}

type AgentMonthlyUsage {
    period_start: Date!
    tokens: Int!
    cost_usd: Float!
}

type AgentKanvasModule {
    id: ID!
    is_active: Boolean!
    config: Mixed
    module: KanvasModule! @belongsTo(relation: "module")
    created_at: DateTime!
    updated_at: DateTime
}

type AgentDailyCycle {
    id: ID!
    cycle_date: Date!
    awake_started_at: DateTime
    awake_ended_at: DateTime
    sleep_started_at: DateTime
    sleep_ended_at: DateTime
    awake_duration_minutes: Int!
    sleep_duration_minutes: Int!
    proactive_actions_count: Int!
    events_processed_count: Int!
    last_action_at: DateTime
    last_action_label: String
    morning_briefing: String
    proposed_actions: Mixed
    skills_emerged: Mixed
    self_improvement_score: String!
    signed_by_text: String
    phases: [AgentSleepPhase!]! @hasMany(relation: "phases")
    created_at: DateTime!
    updated_at: DateTime
}

type AgentSleepPhase {
    id: ID!
    phase: String!
    started_at: DateTime!
    ended_at: DateTime!
    duration_minutes: Int!
    outcome_summary: String
    payload: Mixed
}

type AgentAiModel {
    id: ID!
    name: String!
    config: JSON
    is_active: Boolean!
    is_published: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

input AgentAiInput {
    agent_type_id: Int!
    name: String!
    user_id: ID
    agent_model_id: Int
    agent_llm_config_id: ID
    description: String
    config: Mixed!
    role: Mixed!
    soul: String
    instructions: String
    output_format: String
    identity: Mixed
    user_context: String
    tools_config: String
    voice_config: Mixed
    parent_agent_id: ID
    is_active: Boolean!
    company_task_list_id: Int
    communication_channels: [CommunicationChannelPivot!]
    swarm_ids: [ID!]
    tool_ids: [ID!]
    is_sub_agent: Boolean
}

input CommunicationChannelPivot {
    communication_channel_id: Int!
    entry_point: String
    config: String
}

enum AgentIntegrationConfigKey {
    GOOGLE
    JIRA
}

input AgentIntegrationConfigEntryInput {
    key: AgentIntegrationConfigKey!
    value: Mixed
}

input SetAgentIntegrationConfigInput {
    agent_id: ID!
    config: [AgentIntegrationConfigEntryInput!]!
}

input ChatSimpleInput {
    agent_id: ID!
    session_id: String!
    message: String!
    images: [String!]
    files: [String!]
    uploads: [Upload!]
}

input AgentSessionInput {
    agent_id: ID!
    canal_id: String!
    lead_id: ID!
}

input UserChatInput {
    agent_id: ID!
    message: String!
    session_id: String
    lead_id: ID
    images: [String!]
    files: [String!]
    uploads: [Upload!]
    async: Boolean
}

input NeuronChatInput {
    name: String!
    system_modules_uuid: String!
    entity_id: String!
    thread_id: String!
    message: String!
}

type UserChatResponse {
    response: Mixed!
    session_id: String!
    """
    Null when status is `pending` — the turn is on the queue. The broadcast then carries
    `message_id`; fetch the turn with it (`response` in the payload is dropped whenever the
    push exceeds Pusher's ~10KB cap, so never rely on it being there).
    """
    message: Message
    """
    The session's channel. Null only on the very first turn of a brand-new session, which is
    where the channel gets created; every later turn carries it, pending or not.
    """
    channel: SocialChannel
    "`completed` when the reply is in this response, `pending` when it will be broadcast."
    status: String!
    """
    Broadcast channel to subscribe to for this session, e.g. `agent-chat-141-11569-<uuid>`.
    Events: `agent.chat.response` and `agent.chat.failed`. Always use this value — the name is
    keyed on the AGENT's tenant, which for a global agent is not the caller's company.
    """
    broadcast_channel: String!
}

extend type Mutation @guard {
    createAiAgent(input: AgentAiInput!): AgentAi!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentManagementMutation@create"
        )
    updateAiAgent(id: ID!, input: AgentAiInput!): AgentAi!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentManagementMutation@update"
        )
    deleteAiAgent(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentManagementMutation@delete"
        )
    aiAgentCreateSession(input: AgentSessionInput!): String!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentChatMutation@createSession"
        )
    aiAgentChat(input: ChatSimpleInput!): String!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentChatMutation@chat"
        )
    aiAgentUserChat(input: UserChatInput!): UserChatResponse!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentChatMutation@userChat"
        )
    setAgentIntegrationConfig(input: SetAgentIntegrationConfigInput!): AgentAi!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentIntegrationConfigMutation@set"
        )
    createAgentConfigBackup(
        agent_id: ID!
        notes: String
    ): AgentConfigBackupType!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentConfigBackupMutation@create"
        )
    restoreAgentFromConfigBackup(backup_id: ID!): AgentAi!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentConfigBackupMutation@restore"
        )
}

extend type Query @guard {
    followUpPrompt(
        lead_id: ID!
        pipeline_stage_id: ID!
        session_id: String!
        message_template: String!
        day: Float!
    ): String!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Queries\\FollowUpPromptQuery@getFollowUpPrompt"
        )
    agentsAi(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "description"
                    "is_active"
                    "agent_type_id"
                    "company_task_list_id"
                    "created_at"
                ]
            )
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at"])
    ): [AgentAi!]!
        @paginate(
            model: "Kanvas\\Intelligence\\Agents\\Models\\Agent"
            defaultCount: 25
            scopes: ["fromCompany", "fromApp"]
        )
    agentModels(
        where: _
            @whereConditions(
                columns: ["id", "name", "is_active", "is_published"]
            )
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [AgentAiModel!]!
        @paginate(
            model: "Kanvas\\Intelligence\\Agents\\Models\\AgentModel"
            defaultCount: 25
            scopes: ["fromApp"]
        )

    agentAnalytics(
        from: Date
        to: Date
        bucket: AnalyticsBucket = WEEK
        timezone: String
        agent_type_id: ID
    ): AgentAnalytics!
        @field(
            resolver: "App\\GraphQL\\Analytics\\Queries\\AgentAnalyticsQuery"
        )
    agentConfigBackups(
        agent_id: ID!
        where: _ @whereConditions(columns: ["id", "status", "created_at"])
        orderBy: _ @orderBy(columns: ["id", "created_at"])
    ): [AgentConfigBackupType!]!
        @paginate(
            builder: "App\\GraphQL\\Intelligence\\Builders\\AgentConfigBackupBuilder@build"
            defaultCount: 25
        )
}

type AgentConfigBackupType {
    id: ID!
    uuid: String!
    agents_id: ID!
    status: String!
    file_path: String
    file_size_bytes: Int
    notes: String
    error_message: String
    completed_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
    agent: AgentAi @belongsTo(relation: "agent")
    download_url: String
}

type AgentAnalytics {
    periods: [AnalyticsPoint!]!
    total: Int!
    by_type: [AnalyticsCategoryPoint!]!
    by_model: [AnalyticsCategoryPoint!]!
    by_deployment_status: [AnalyticsCategoryPoint!]!
    by_user: [AnalyticsCategoryPoint!]!
}

