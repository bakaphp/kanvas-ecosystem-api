extend type Mutation @guardByAppKey {
    setAgentKanvasModule(
        agent_id: ID!
        kanvas_module_id: ID!
        config: Mixed
        is_active: Boolean
    ): AgentKanvasModule!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentKanvasModuleMutation@set"
        )
    removeAgentKanvasModule(agent_id: ID!, kanvas_module_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Intelligence\\Mutations\\AgentKanvasModuleMutation@remove"
        )
}
