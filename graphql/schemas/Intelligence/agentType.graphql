type agentType {
    id: ID!
    uuid: String!
    name: String!
    description: String
    provider: String
    handler: String
    config: Mixed
    role: Mixed
    soul: String
    instructions: String
    output_format: String
    is_active: Boolean!
    is_default: Boolean!
    is_published: Boolean!
    is_multi_agent: Boolean!
    weight: Int!
    multi_agent_list: Mixed
    tools: [NervousSystemTool!]! @belongsToMany(relation: "tools")
    createdAt: DateTime!
    updatedAt: DateTime!
}

extend type Query @guard {
    agentTypes(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "name"
                    "provider"
                    "is_active"
                    "is_default"
                    "is_published"
                ]
            )
        orderBy: _
            @orderBy(
                columns: ["id", "createdAt", "updatedAt", "name", "weight"]
            )
    ): [agentType!]!
        @paginate(
            model: "Kanvas\\Intelligence\\Agents\\Models\\AgentType"
            defaultCount: 25
            scopes: ["fromAppOrGlobal", "notDeleted"]
        )
}
