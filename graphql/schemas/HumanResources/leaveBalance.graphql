type HrLeaveBalance {
    id: ID!
    period_year: Int!
    entitled_days: Float!
    accrued_days: Float!
    carried_over_days: Float!
    used_days: Float!
    pending_days: Float!
    available_days: Float!
    leaveType: HrLeaveType! @belongsTo(relation: "leaveType")
    employee: HrEmployee! @belongsTo(relation: "employee")
}
