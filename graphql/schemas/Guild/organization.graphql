type Organization {
    id: ID!
    uuid: String!
    company: Company! @belongsTo(relation: "company")
    user: User! @belongsTo(relation: "user")
    name: String!
    email: String
    phone: String
    "Legacy free-text address. Kept for the code that still reads it — use `addresses` for anything structured (invoicing, shipping, external billing APIs)."
    address: String
    "Structured addresses — typically one Billing and one Shipping. This is what Scribe invoices and external billing APIs read."
    addresses: [OrganizationAddress!]! @hasMany(relation: "addresses")
    "The address an invoice bills to: the one tagged Billing, else the default, else whichever exists."
    billing_address: OrganizationAddress @method(name: "billingAddress")
    organization_type: OrganizationType @belongsTo(relation: "organizationType")
    "The Kanvas Users who may approve this organization's AP/AR items."
    approvers: [OrganizationApprover!]! @hasMany(relation: "approvers")
    leads: [Lead!]!
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Guild\\Queries\\Organizations\\OrganizationLeadsQuery@getLeadsBuilder"
        )
    total_employees: Int!
    created_at: DateTime!
    updated_at: DateTime
    photo: Filesystem @method(name: "getPhoto")
    tags: [Tag!]
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Social\\Queries\\Tags\\TagsQueries@getTagsBuilder"
        )
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
}

type OrganizationAddress {
    id: ID!
    organization: Organization! @belongsTo(relation: "organization")
    address: String
    address_2: String
    city: String
    county: String
    state: String
    zip: String
    latitude: Float
    longitude: Float
    is_default: Boolean!
    "Billing / Shipping / Home / Other. A plain string — the name `AddressType` is already taken in the Ecosystem schema by an unrelated value object."
    type: String @method(name: "addressTypeName")
    "True only when every field an external billing API needs is present. Mercury and Stripe validate an address all-or-nothing, so a partial one is rejected outright — this lets the UI warn before that happens."
    is_complete: Boolean! @method(name: "isComplete")
    country: Country @belongsTo(relation: "country")
    states: States @belongsTo(relation: "state")
    cities: Cities @belongsTo(relation: "city")
    created_at: DateTime!
    updated_at: DateTime
}

input OrganizationInput {
    name: String!
    email: String
    phone: String
    "Legacy free-text address. Use `addresses` for anything structured."
    address: String
    "DEPRECATED — never persisted. The organizations table has no such columns; these have always been silently discarded. Use `addresses` instead."
    city: String
    "DEPRECATED — never persisted. Use `addresses` instead."
    state: String
    "DEPRECATED — never persisted. Use `addresses` instead."
    zip: String
    "Structured addresses, set on create/update. One row per type — re-sending Billing updates it rather than adding a second."
    addresses: [AddressInput!]
    organization_type_id: ID
}

input OrganizationPeopleInput {
    organization_id: ID!
    peoples_id: [ID!]
}

type OrganizationDuplicateGroup {
    canonical_id: Int!
    member_ids: [Int!]!
    reason: String!
    sample_name: String!
    organizations: [Organization!]!
        @field(resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationMergeMutation@organizations")
}

extend type Mutation @guard {
    createOrganization(input: OrganizationInput!): Organization
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationManagementMutation@create"
        )
    updateOrganization(id: ID!, input: OrganizationInput!): Organization
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationManagementMutation@update"
        )
    deleteOrganization(id: ID!): Boolean
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationManagementMutation@delete"
        )
    restoreOrganization(id: ID!): Boolean
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationManagementMutation@restore"
        )
    addPeopleToOrganization(input: OrganizationPeopleInput!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\PeopleOrganizationMutation@add"
        )
    removePeopleFromOrganization(input: OrganizationPeopleInput!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\PeopleOrganizationMutation@remove"
        )

    mergeOrganizations(source_ids: [Int!]!, target_id: Int!): Organization!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationMergeMutation@merge"
        )
    detectOrganizationDuplicates(
        max_groups: Int
    ): [OrganizationDuplicateGroup!]!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationMergeMutation@detectDuplicates"
        )

    addOrganizationAddress(
        organization_id: ID!
        input: AddressInput!
    ): OrganizationAddress!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationAddressMutation@add"
        )

    updateOrganizationAddress(id: ID!, input: AddressInput!): OrganizationAddress!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationAddressMutation@update"
        )

    deleteOrganizationAddress(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationAddressMutation@delete"
        )
}

extend type Query @guard {
    organizations(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "name"
                    "uuid"
                    "email"
                    "phone"
                    "total_employees"
                    "organization_type_id"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "name"
                    "total_employees"
                ]
            )
    ): [Organization!]!
        @paginate(
            model: "Kanvas\\Guild\\Organizations\\Models\\Organization"
            scopes: ["fromCompany", "fromApp", "notDeleted"]
            defaultCount: 25
        )

    findOrganizationDuplicates(
        max_groups: Int
    ): [OrganizationDuplicateGroup!]!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Organizations\\OrganizationMergeMutation@findDuplicates"
        )
}
