type LeadReceiver {
    id: ID!
    uuid: String!
    user: User! @belongsTo(relation: "user")
    company: Company! @belongsTo(relation: "company")
    branch: CompanyBranch! @belongsTo(relation: "branch")
    agent: User! @belongsTo(relation: "agent")
    name: String!
    source_name: String
    notification_email: String
    is_default: Boolean!
    template: Mixed
    total_leads: Int!
    leadSource: LeadSource @belongsTo(relation: "leadSource")
    leadType: LeadType @belongsTo(relation: "leadType")
    leadRotation: LeadRotation @belongsTo(relation: "rotation")
    # Aliases from the former duplicate declaration in lead.graphql; same relations as the lead* fields.
    source: LeadSource @belongsTo(relation: "leadSource")
    type: LeadType @belongsTo(relation: "leadType")
    rotation: Rotation @belongsTo(relation: "rotation")
    "ReceiverWebhook uuid that routes POST /api/receiver/{uuid} to this receiver; null when none is wired."
    submit_webhook_uuid: String
        @field(
            resolver: "App\\GraphQL\\Guild\\Queries\\Leads\\LeadReceiverWebhookQuery@submitWebhookUuid"
        )
    created_at: DateTime!
    updated_at: DateTime
}

input LeadReceiverInput {
    name: String!
    agents_id: ID!
    is_default: Boolean!
    rotations_id: ID
    source_name: String
    notification_email: String
    lead_sources_id: ID!
    lead_types_id: ID!
    template: Mixed
}

extend type Mutation {
    createLeadReceiver(input: LeadReceiverInput!): LeadReceiver!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Leads\\LeadReceiverManagement@create"
        )
    updateLeadReceiver(id: ID!, input: LeadReceiverInput!): LeadReceiver!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Leads\\LeadReceiverManagement@update"
        )
    deleteLeadReceiver(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Guild\\Mutations\\Leads\\LeadReceiverManagement@delete"
        )
}

extend type Query {
    leadReceivers(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "name"
                    "source_name"
                    "notification_email"
                    "is_default"
                ]
            )
    ): [LeadReceiver!]!
        @paginate(
            model: "Kanvas\\Guild\\Leads\\Models\\LeadReceiver"
            scopes: ["fromCompany", "fromApp", "notDeleted"]
            defaultCount: 10
        )
}
