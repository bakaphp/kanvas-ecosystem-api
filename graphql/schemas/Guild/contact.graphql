type Contact {
    id: ID!
    type: ContactType! @belongsTo
    people: People! @belongsTo
    value: String
    is_opt_out: Boolean!
    weight: Int!
    validation_status: String! @method(name: "validationStatusValue")
    bounced_at: String
    is_deliverable: Boolean! @method(name: "isDeliverable")
}

type ContactType {
    id: ID!
    company: Company! @belongsTo
    name: String!
    user: User! @belongsTo
}

type Address {
    id: ID!
    people: People! @belongsTo
    address: String
    address_2: String
    city: String
    county: String
    state: String
    zip: String
    country: Country
    latitude: Float
    longitude: Float
    is_default: Boolean!
    countries: Country @belongsTo(relation: "country")
    states: States @belongsTo(relation: "state")
    cities: Cities @belongsTo(relation: "city")
}

input ContactInput {
    value: String!
    contacts_types_id: ID!
    weight: Int
    is_opt_out: Boolean
    id: ID
}

input UpdateContactInput {
    value: String
    contacts_types_id: ID
    weight: Int
    is_opt_out: Boolean
}

"The shared address-type lookup — Billing is Billing whether it belongs to a Person or an Organization."
enum AddressTypeEnum {
    HOME @enum(value: "Home")
    BILLING @enum(value: "Billing")
    SHIPPING @enum(value: "Shipping")
    EMPLOYER @enum(value: "Employer")
    OTHER @enum(value: "Other")
}

input AddressInput {
    "Nullable so an update can PATCH a single field — requiring the street back just to correct a zip is how people accidentally blank out data."
    address: String
    address_2: String
    city: String
    county: String
    city_id: ID
    state: String
    state_id: ID
    zip: String
    country: String
    country_id: ID
    latitude: Float
    longitude: Float
    is_default: Boolean
    "Billing / Shipping / Home / Other. One address per type — re-sending Billing UPDATES the existing one rather than stacking a second."
    type: AddressTypeEnum
    id: ID
}

extend type Query @guard {
    contactType(
        where: _ @whereConditions(columns: ["name"])
        orderBy: _ @orderBy(columns: ["name", "created_at"])
    ): [ContactType!]!
        @paginate(
            model: "Kanvas\\Guild\\Customers\\Models\\ContactType"
            defaultCount: 25
            scopes: ["notDeleted"]
        )
}
