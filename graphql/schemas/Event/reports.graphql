type OpenEventTrackingRow {
    event_version_id: ID!
    event_name: String!
    event_date: String
    counts: Mixed!
    total_inscribed: Int!
    goal: Int!
    goal_percentage: Float!
    color: String!
}

type InscriptionWeekData {
    week: Int!
    counts: Mixed!
    total: Int!
    objective: Int!
}

type InscriptionsReport {
    event_version_id: ID!
    event_name: String!
    goal: Int!
    weeks: [InscriptionWeekData!]!
}

type InscriptionTrack {
    type: String!
    slug: String!
    count: Int!
}

type CompanyConcentration {
    organization_id: ID
    organization_name: String!
    count: Int!
    percentage: Float!
}

enum OrgActivityFilter {
    ALL @enum(value: "all")
    ACTIVE @enum(value: "active")
    INACTIVE @enum(value: "inactive")
    LAPSED @enum(value: "lapsed")
    NEW @enum(value: "new")
}

enum OrgActivityOrder {
    COUNT_DESC @enum(value: "count_desc")
    COUNT_ASC @enum(value: "count_asc")
    LAST_DATE_DESC @enum(value: "last_date_desc")
    FIRST_DATE_ASC @enum(value: "first_date_asc")
    NAME_ASC @enum(value: "name_asc")
}

type OrganizationEventActivity {
    organization_id: ID
    organization_name: String!
    count: Int!
    unique_people_count: Int!
    first_event_date: Date
    last_event_date: Date
    had_prior_activity: Boolean!
}

extend type Query @guard {
    eventsTracking(
        weeks_ahead: Int = 7
        event_type_id: ID
        event_class_id: ID
        event_category_id: ID
        search: String
        color: String
        has_goal: Boolean
    ): [OpenEventTrackingRow!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventsTrackingQuery"
        )

    eventInscriptionsVsObjective(
        event_version_id: ID!
        cumulative: Boolean = false
        include_types: [String!]
        exclude_types: [String!]
    ): InscriptionsReport!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventInscriptionsVsObjectiveQuery"
        )

    eventInscriptionsVsHistorical(
        event_version_id: ID!
        cumulative: Boolean = false
        include_types: [String!]
        exclude_types: [String!]
    ): InscriptionsReport!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventInscriptionsVsHistoricalQuery"
        )

    eventInscriptionTrack(
        event_version_id: ID!
        exclude_types: [String!]
    ): [InscriptionTrack!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventInscriptionTrackQuery"
        )

    eventParticipantConcentration(
        event_version_id: ID!
        top_n: Int
        include_types: [String!]
        exclude_types: [String!]
    ): [CompanyConcentration!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventParticipantConcentrationQuery"
        )

    organizationsEventActivity(
        from_date: Date
        to_date: Date
        activity: OrgActivityFilter = ALL
        min_count: Int
        max_count: Int
        event_type_id: ID
        event_category_id: ID
        include_participant_types: [String!]
        exclude_participant_types: [String!]
        top_n: Int
        order_by: OrgActivityOrder = COUNT_DESC
    ): [OrganizationEventActivity!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\OrganizationsEventActivityQuery"
        )
}
