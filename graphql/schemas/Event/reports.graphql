type OpenEventTrackingRow {
    event_version_id: ID!
    event_name: String!
    event_date: String
    counts: Mixed!
    total_inscribed: Int!
    "The version's total target."
    goal: Int!
    "Registrations expected by now, on the goal curve for the weeks left before the event."
    goal_to_date: Int!
    "total_inscribed as a percentage of goal_to_date, not of goal. color is judged on the same basis."
    goal_percentage: Float!
    color: String!
}

type InscriptionWeekData {
    week: Int!
    counts: Mixed!
    total: Int!
    objective: Int!
}

type InscriptionsReport {
    event_version_id: ID!
    event_name: String!
    goal: Int!
    weeks: [InscriptionWeekData!]!
}

type InscriptionTrack {
    type: String!
    slug: String!
    count: Int!
}

type CompanyConcentration {
    organization_id: ID
    organization_name: String!
    count: Int!
    percentage: Float!
}

enum OrgActivityFilter {
    ALL @enum(value: "all")
    ACTIVE @enum(value: "active")
    INACTIVE @enum(value: "inactive")
    LAPSED @enum(value: "lapsed")
    NEW @enum(value: "new")
}

enum OrgActivityOrder {
    COUNT_DESC @enum(value: "count_desc")
    COUNT_ASC @enum(value: "count_asc")
    LAST_DATE_DESC @enum(value: "last_date_desc")
    FIRST_DATE_ASC @enum(value: "first_date_asc")
    NAME_ASC @enum(value: "name_asc")
}

type OrganizationEventActivity {
    organization_id: ID
    organization_name: String!
    count: Int!
    unique_people_count: Int!
    first_event_date: Date
    last_event_date: Date
    had_prior_activity: Boolean!
    "Distinct people in the 12 months up to today, whatever from_date / to_date say."
    participants_last_year: Int!
    "Distinct people ever, whatever from_date / to_date say."
    participants_total: Int!
    "One entry per calendar year from from_date (or the first year with activity) to to_date (or this year), zeros included."
    by_year: [OrganizationActivityYear!]!
}

type OrganizationEventParticipant {
    people_id: ID!
    name: String!
    registration_type: String
}

"One event version a client company's people registered for."
type OrganizationEventHistoryEntry {
    event_version_id: ID!
    event_name: String!
    version_name: String!
    event_date: Date
    registrations: Int!
    "Distinct people."
    participants: Int!
    people: [OrganizationEventParticipant!]!
}

type OrganizationActivityYear {
    year: Int!
    "Registrations that year."
    count: Int!
    "Distinct people that year."
    participants: Int!
}

extend type Query @guard {
    eventsTracking(
        weeks_ahead: Int = 7
        event_type_id: ID
        event_class_id: ID
        event_category_id: ID
        search: String
        color: String
        has_goal: Boolean
    ): [OpenEventTrackingRow!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventsTrackingQuery"
        )

    eventInscriptionsVsObjective(
        event_version_id: ID!
        cumulative: Boolean = false
        include_types: [String!]
        exclude_types: [String!]
    ): InscriptionsReport!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventInscriptionsVsObjectiveQuery"
        )

    eventInscriptionsVsHistorical(
        event_version_id: ID!
        cumulative: Boolean = false
        include_types: [String!]
        exclude_types: [String!]
    ): InscriptionsReport!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventInscriptionsVsHistoricalQuery"
        )

    eventInscriptionTrack(
        event_version_id: ID!
        exclude_types: [String!]
    ): [InscriptionTrack!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventInscriptionTrackQuery"
        )

    eventParticipantConcentration(
        event_version_id: ID!
        top_n: Int
        include_types: [String!]
        exclude_types: [String!]
    ): [CompanyConcentration!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\EventParticipantConcentrationQuery"
        )

    "A client company's participation history, newest first. Pair it with organizations(where: { column: ID }) for the company itself and peoples(hasOrganization: ...) for its contacts."
    organizationEventHistory(
        organization_id: ID!
        from_date: Date
        to_date: Date
        "Max versions returned. Default 100, cap 500."
        limit: Int = 100
    ): [OrganizationEventHistoryEntry!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\OrganizationEventHistoryQuery"
        )

    organizationsEventActivity(
        from_date: Date
        to_date: Date
        activity: OrgActivityFilter = ALL
        min_count: Int
        max_count: Int
        event_type_id: ID
        event_category_id: ID
        include_participant_types: [String!]
        exclude_participant_types: [String!]
        top_n: Int
        order_by: OrgActivityOrder = COUNT_DESC
    ): [OrganizationEventActivity!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\Reports\\OrganizationsEventActivityQuery"
        )
}
