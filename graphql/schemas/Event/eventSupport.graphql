input EventLookupInput {
    name: String!
    is_default: Boolean
}

input EventLookupUpdateInput {
    name: String
    is_default: Boolean
}

extend type Mutation @guard {
    createEventType(input: EventLookupInput!): EventType!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@createEventType"
        )
    updateEventType(id: ID!, input: EventLookupUpdateInput!): EventType!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@updateEventType"
        )
    deleteEventType(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@deleteEventType"
        )

    createEventClass(input: EventLookupInput!): EventClass!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@createEventClass"
        )
    updateEventClass(id: ID!, input: EventLookupUpdateInput!): EventClass!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@updateEventClass"
        )
    deleteEventClass(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@deleteEventClass"
        )

    createEventStatus(input: EventLookupInput!): EventStatus!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@createEventStatus"
        )
    updateEventStatus(id: ID!, input: EventLookupUpdateInput!): EventStatus!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@updateEventStatus"
        )
    deleteEventStatus(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@deleteEventStatus"
        )

    createEventTheme(input: EventLookupInput!): EventTheme!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@createEventTheme"
        )
    updateEventTheme(id: ID!, input: EventLookupUpdateInput!): EventTheme!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@updateEventTheme"
        )
    deleteEventTheme(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@deleteEventTheme"
        )

    createEventThemeArea(input: EventLookupInput!): EventThemeArea!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@createEventThemeArea"
        )
    updateEventThemeArea(
        id: ID!
        input: EventLookupUpdateInput!
    ): EventThemeArea!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@updateEventThemeArea"
        )
    deleteEventThemeArea(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Lookups\\EventLookupMutation@deleteEventThemeArea"
        )
}

extend type Query @guard {
    eventThemes(
        search: String @search
        where: _ @whereConditions(columns: ["id", "name", "companies_id"])
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [EventTheme!]!
        @paginate(
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            model: "Kanvas\\Event\\Themes\\Models\\Theme"
            defaultCount: 25
        )
    eventThemeAreas(
        search: String @search
        where: _ @whereConditions(columns: ["id", "name", "companies_id"])
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [EventThemeArea!]!
        @paginate(
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            model: "Kanvas\\Event\\Themes\\Models\\ThemeArea"
            defaultCount: 25
        )
    eventTypes(
        search: String @search
        where: _ @whereConditions(columns: ["id", "name", "companies_id"])
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [EventType!]!
        @paginate(
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            model: "Kanvas\\Event\\Events\\Models\\EventType"
            defaultCount: 25
        )
    eventStatus(
        search: String @search
        where: _ @whereConditions(columns: ["id", "name", "companies_id"])
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [EventStatus!]!
        @paginate(
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            model: "Kanvas\\Event\\Events\\Models\\EventStatus"
            defaultCount: 25
        )
    eventClasses(
        search: String @search
        where: _ @whereConditions(columns: ["id", "name", "companies_id"])
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [EventClass!]!
        @paginate(
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            model: "Kanvas\\Event\\Events\\Models\\EventClass"
            defaultCount: 25
        )
}
