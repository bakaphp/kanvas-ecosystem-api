type TimeSlots {
    id: ID!
    apps_id: ID!
    companies_id: ID!
    resources_id: ID!
    resources_type: String!
    start_at: DateTime!
    end_at: DateTime!
    capacity: Int!
    status: String
    price_snapshot: Float
    currency: String
    meta: Mixed
    created_at: DateTime
    updated_at: DateTime
    resource: TimeSlotResource @morphTo
}

union TimeSlotResource = Product

input TimeSlotsFilterInput {
    resources_id: ID
    resources_type: String
    start_at: DateTime
    end_at: DateTime
    status: String
    date_from: DateTime
    date_to: DateTime
}

extend type Query @guard {
    timeSlots(
        search: String @search
        where: _ 
            @whereConditions(
                columns: [
                    "id"
                    "companies_id"
                    "resources_id"
                    "resources_type"
                    "start_at"
                    "end_at"
                    "capacity"
                    "status"
                    "currency"
                ]
            )
        orderBy: _ @orderBy(columns: ["id", "start_at", "end_at", "created_at", "updated_at"])
    ): [TimeSlots!]!
        @paginate(
            scopes: ["fromApp", "fromCompany"]
            model: "Kanvas\\Event\\Events\\Models\\TimeSlots"
            defaultCount: 25
        )

    timeSlotsForResource(
        resources_id: ID!
        resources_type: String!
        date_from: DateTime
        date_to: DateTime
        status: String
        orderBy: _ @orderBy(columns: ["start_at", "end_at", "capacity"])
    ): [TimeSlots!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\TimeSlots\\TimeSlotsQuery@getForResource"
        )

    availableTimeSlots(
        resources_id: ID!
        resources_type: String!
        date_from: DateTime!
        date_to: DateTime!
        capacity_needed: Int = 1
        orderBy: _ @orderBy(columns: ["start_at", "end_at"])
    ): [TimeSlots!]!
        @field(
            resolver: "App\\GraphQL\\Event\\Queries\\TimeSlots\\TimeSlotsQuery@getAvailable"
        )
}