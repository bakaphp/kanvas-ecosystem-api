type Event {
    id: ID!
    uuid: String!
    name: String!
    slug: String!
    description: String
    version_count: Int!
    start_at: String
    end_at: String
    user: User! @belongsTo(relation: "user")
    company: Company! @belongsTo(relation: "company")
    theme: EventTheme @belongsTo(relation: "theme")
    themeArea: EventThemeArea @belongsTo(relation: "themeArea")
    eventStatus: EventClass @belongsTo(relation: "eventStatus")
    type: EventType @belongsTo(relation: "eventType")
    class: EventClass @belongsTo(relation: "eventClass")
    category: EventCategory @belongsTo(relation: "eventCategory")
    resources_id: ID
    resources_type: String
    resource: EventResourceUnion @morphTo(relation: "resource")
    orders: [Order!]!
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Event\\Builders\\Events\\EventOrderBuilder@getEventOrders"
        )
    versions: [EventVersion!]!
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Event\\Builders\\Events\\EventVersionBuilder@getEventVersion"
        )
    resources: [EventResource!]! @hasMany(relation: "resources")
    created_at: DateTime
    updated_at: DateTime
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
    custom_fields: [CustomField!]!
        @paginate(
            defaultCount: 25
            resolver: "App\\GraphQL\\Ecosystem\\Queries\\CustomFields\\CustomFieldQuery@getAllByGraphType"
        )
    tags: [Tag!]
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Social\\Queries\\Tags\\TagsQueries@getTagsBuilder"
        )
}

type EventVersion {
    id: ID!
    uuid: String!
    name: String!
    company: Company! @belongsTo(relation: "company")
    event: Event! @belongsTo(relation: "event")
    user: User! @belongsTo(relation: "user")
    version_number: Int!
    version: String!
    slug: String!
    agenda: Mixed
    metadata: Mixed
    description: String
    classification: String
    price_per_ticket: Money!
    created_at: DateTime
    updated_at: DateTime
    dates: [EventVersionDate!]! @hasMany(relation: "dates")
    total_attendees: Int!
    start_at: String
    end_at: String
    participants: [EventVersionParticipant!]!
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Event\\Builders\\Events\\EventVersionBuilder@getParticipants"
        )
    facilitators: [Facilitator!]!
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Event\\Builders\\Events\\EventVersionBuilder@getFacilitators"
        )
    participant_attendees: [EventVersionParticipantDate!]!
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Event\\Builders\\Events\\EventVersionBuilder@getParticipantAttendees"
        )
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
    custom_fields: [CustomField!]!
        @paginate(
            defaultCount: 25
            resolver: "App\\GraphQL\\Ecosystem\\Queries\\CustomFields\\CustomFieldQuery@getAllByGraphType"
        )
    tags: [Tag!]
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Social\\Queries\\Tags\\TagsQueries@getTagsBuilder"
        )
}

type EventVersionDate {
    id: ID!
    event_version: EventVersion! @belongsTo(relation: "eventVersion")
    user: User! @belongsTo(relation: "user")
    date: Date! @method(name: "getDate")
    start_time: String!
    end_time: String!
}

type EventVersionParticipant {
    id: ID!
    event_version: EventVersion! @belongsTo(relation: "eventVersion")
    participant: Participant! @belongsTo(relation: "participant")
    ticket_price: Money!
    discount: Money!
    invoice_date: Date
    metadata: Mixed
    participant_type: ParticipantType @belongsTo(relation: "participantType")
    created_at: DateTime
    updated_at: DateTime
}

type EventVersionParticipantDate {
    id: ID!
    event_version_date: EventVersionDate!
        @belongsTo(relation: "eventVersionDate")
    participant: Participant! @belongsTo(relation: "participant")
    arrived: DateTime!
    start_time: String!
    end_time: String!
}

input EventInput {
    name: String!
    slug: String
    description: String
    theme_id: ID
    theme_area_id: ID
    status_id: ID
    type_id: ID!
    class_id: ID
    category_id: ID!
    resources: Mixed
    participants: [String!]
    dates: [EventVersionDateInput!]!
}

input EventUpdateInput {
    name: String
    description: String
    resources_id: ID
    resources_type: String
}

type EventResource {
    id: ID!
    event_id: ID!
    resources_id: ID!
    resources_type: String!
    metadata: Mixed
    created_at: DateTime
    updated_at: DateTime
}

union EventResourceUnion = Variant

input EventVersionDateInput {
    date: Date!
    start_time: String!
        @rules(apply: ["required", "regex:/^([01]\\d|2[0-3]):([0-5]\\d)$/"])
    end_time: String!
        @rules(apply: ["required", "regex:/^([01]\\d|2[0-3]):([0-5]\\d)$/"])
}

input TimeSlotBookingInput {
    time_slot_id: ID
    participants: Mixed
    event_name: String
    event_description: String
    hold_id: String
    metadata: Mixed
    payment_intent_id: String
    resources: Mixed
    order_items: [OrderItemInput!]
}

input OrderItemInput {
    variant_id: ID!
    name: String!
    quantity: Int!
    price: Float!
    metadata: Mixed
}

input ResourceBookingInput {
    resources_id: ID!
    resources_type: String
    start_at: String!
    end_at: String
    participants: Mixed
    event_name: String
    event_description: String
    hold_id: String
    payment_intent_id: String
    payment_method_id: String
    metadata: Mixed
    resources: Mixed
    order_items: [OrderItemInput!]
}

input ResourceBookingUpdateInput {
    event_version_id: ID!
    resources_id: ID
    resources_type: String
    start_at: String
    end_at: String
    participants: Mixed
    event_name: String
    event_description: String
    metadata: Mixed
    resources: Mixed
}

type ResourceBookingDeleteResult {
    success: Boolean!
    message: String!
    deleted_event: Mixed
}

type ResourceHoldResult {
    hold_id: String!
    expires_at: String!
    message: String!
}

input ConfirmBookingInput {
    event_version_id: ID!
    payment_intent_id: String!
    amount: Float
}

type ConfirmBookingResult {
    success: Boolean!
    message: String!
    event_version: EventVersion!
    payment: Mixed!
    order: Mixed!
}

extend type Mutation @guard {
    createEvent(input: EventInput!): Event!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Events\\EventManagementMutation@create"
        )
    updateEvent(id: ID!, input: EventUpdateInput!): Event!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Events\\EventManagementMutation@update"
        )
    deleteEvent(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Events\\EventManagementMutation@delete"
        )
    
    bookTimeSlot(input: TimeSlotBookingInput!): EventVersion!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Booking\\TimeSlotBookingMutation@book"
        )

    bookResource(input: ResourceBookingInput!): EventVersion!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Booking\\ResourceBookingMutation@book"
        )

    updateResourceBooking(input: ResourceBookingUpdateInput!): EventVersion!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Booking\\ResourceBookingMutation@update"
        )

    deleteResourceBooking(event_version_id: ID!): ResourceBookingDeleteResult!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Booking\\ResourceBookingMutation@delete"
        )

    confirmBooking(input: ConfirmBookingInput!): ConfirmBookingResult!
        @field(
            resolver: "App\\GraphQL\\Event\\Mutations\\Booking\\EventPaymentMutation@confirmBooking"
        )
}

extend type Query @guard {
    events(
        search: String @search
        where: _
            @whereConditions(columns: ["id", "name", "slug", "companies_id", "resources_id", "resources_type"])
        status: _
            @whereConditions(
                columns: ["name", "slug", "id"]
                handler: "App\\GraphQL\\Event\\Handlers\\EventStatusHandler"
            )
        orderBy: _ @orderBy(columns: ["id", "created_at", "updated_at", "name"])
    ): [Event!]!
        @paginate(
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            model: "Kanvas\\Event\\Events\\Models\\Event"
            defaultCount: 25
        )
    eventVersions(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "name"
                    "slug"
                    "event_id"
                    "companies_id"
                    "version_number"
                    "start_at"
                    "end_at"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "name"
                    "event_id"
                    "version_number"
                    "start_at"
                    "end_at"
                ]
            )
    ): [EventVersion!]!
        @paginate(
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            model: "Kanvas\\Event\\Events\\Models\\EventVersion"
            defaultCount: 25
        )
    eventVersionParticipants(
        search: String @search
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "event_version_id"
                    "participant_id"
                    "ticket_price"
                    "discount"
                    "invoice_date"
                    "participant_type_id"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "created_at"
                    "updated_at"
                    "event_version_id"
                    "participant_id"
                    "ticket_price"
                    "discount"
                    "invoice_date"
                    "participant_type_id"
                ]
            )
    ): [EventVersionParticipant!]!
        @paginate(
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            model: "Kanvas\\Event\\Events\\Models\\EventVersionParticipant"
            defaultCount: 25
        )
}
