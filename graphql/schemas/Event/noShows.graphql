type EventNoShow {
    id: ID!
    used_date: Date
    expiration_date: Date!
    code: String!
    participant: Participant! @belongsTo(relation: "participant")
    eventVersion: EventVersion! @belongsTo(relation: "eventVersion")
    event: Event! @belongsTo(relation: "event")
}

extend type Query @guard {
    "Players who never checked in for a booking that already started. Grain is the player, not the booking."
    eventNoShows(
        from_date: Date
        to_date: Date
        resources_id: ID
    ): [EventNoShow!]!
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Event\\Builders\\Events\\NoShowBuilder@noShows"
        )
}
