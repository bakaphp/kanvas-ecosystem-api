type NervousSystemSkill {
    id: ID!
    uuid: String!
    name: String!
    description: String
    skill_type: String!
    handler: String
    definition: Mixed
    frameworks: Mixed!
    version: String!
    is_active: Boolean!
    agents_using_count: Int!
    created_at: DateTime!
    updated_at: DateTime
}

type NervousSystemTool {
    id: ID!
    uuid: String!
    name: String!
    description: String
    tool_type: String!
    category: NervousSystemToolCategory @belongsTo(relation: "category")
    handler: String
    input_schema: Mixed
    output_schema: Mixed
    requires_permission: Mixed
    frameworks: Mixed!
    version: String!
    is_active: Boolean!
    agent: AgentAi @belongsTo(relation: "agent")
    agentTypes: [agentType!]! @belongsToMany(relation: "agentTypes")
    """
    Live state of an MCP server row. Null on every other tool_type. Nested rather than flattened into
    the tool list so "this server is FAILED" and "last synced 3h ago" stay expressible — a flat list
    of methods cannot say either. Pass `agent_id` for that agent's connection; without it only the
    catalog fields (vendor, auth) are filled, because every connection belongs to one agent.
    """
    mcp(agent_id: ID): NervousSystemMcpServerState
        @field(resolver: "App\\GraphQL\\NervousSystem\\Queries\\McpQuery@serverState")
    created_at: DateTime!
    updated_at: DateTime
}

type NervousSystemMcpServerState {
    vendor: String
    """
    Every way this server can be connected — `bearer` (paste a key) and/or `oauth` (Connect button).
    Offer the admin each one listed; always filled, with or without `agent_id`.
    """
    auth_methods: [String!]!
    """
    True when the server runs at each company's own address (a self-hosted n8n, any open-source MCP
    server) — show a server URL field and pass it as `server_url` when connecting.
    """
    url_per_connection: Boolean!
    "How this agent connected: `bearer` | `oauth`. Null when it isn't connected or no `agent_id` was given."
    auth: String
    "The agent holds the tool, has a credential, and the vendor has not rejected it."
    connected: Boolean!
    "active | failed | null (never connected)."
    status: String
    connected_at: DateTime
    "The vendor account the agent signed in with, when the server tells us."
    connected_as: String
    last_error: String
    "When the durable snapshot was last proven against the server."
    fetched_at: DateTime
    tool_count: Int!
    """
    Read from the durable snapshot, never from the catalog — the methods a server exposes are
    deliberately not grantable rows, so this costs no network and still answers while the vendor is down.
    """
    tools: [NervousSystemMcpTool!]!
}

type NervousSystemMcpTool {
    "What the model calls it: {prefix}__{remote_name}, normalised to what providers accept."
    name: String!
    "What the server published, and what it is called by on invoke."
    remote_name: String!
    description: String
}

"One agent's connection to one MCP server."
type NervousSystemMcpConnection {
    agent: AgentAi!
    "bearer | oauth"
    auth: String
    status: String
    connected_at: DateTime
    connected_as: String
    last_error: String
}

type NervousSystemMcpConnectResult {
    "OAuth servers: the consent URL to open in a browser. Token servers: null."
    url: String
    "Token servers: true once the token has been checked against the server."
    connected: Boolean!
}

type NervousSystemToolCategory {
    id: ID!
    slug: String!
    name: String!
    description: String
    icon: String
    display_order: Int!
    is_active: Boolean!
    created_at: DateTime!
    updated_at: DateTime
}

input CreateNervousSystemToolCategoryInput {
    slug: String!
    name: String!
    description: String
    icon: String
    display_order: Int
    is_active: Boolean
}

input UpdateNervousSystemToolCategoryInput {
    name: String
    description: String
    icon: String
    display_order: Int
    is_active: Boolean
}

type NervousSystemAgentSkill {
    id: ID!
    uuid: String!
    agent: AgentAi! @belongsTo(relation: "agent")
    skill: NervousSystemSkill! @belongsTo(relation: "skill")
    grantedBy: User @belongsTo(relation: "grantedBy")
    granted_at: DateTime!
    expires_at: DateTime
    is_active: Boolean!
    config: Mixed
    created_at: DateTime!
    updated_at: DateTime
}

type NervousSystemAgentTool {
    id: ID!
    uuid: String!
    agent: AgentAi! @belongsTo(relation: "agent")
    tool: NervousSystemTool! @belongsTo(relation: "tool")
    grantedBy: User @belongsTo(relation: "grantedBy")
    granted_at: DateTime!
    expires_at: DateTime
    is_active: Boolean!
    is_deleted: Boolean!
    config: Mixed
    created_at: DateTime!
    updated_at: DateTime
}

type NervousSystemAgentCapabilities {
    skills: [NervousSystemSkill!]!
    tools: [NervousSystemTool!]!
}

input CreateNervousSystemSkillInput {
    name: String!
    frameworks: [String!]!
    skill_type: String
    description: String
    handler: String
    definition: Mixed
    version: String
    is_active: Boolean
    apps_id: Int
}

input UpdateNervousSystemSkillInput {
    name: String!
    frameworks: [String!]!
    skill_type: String
    description: String
    handler: String
    definition: Mixed
    version: String
    is_active: Boolean
}

input CreateNervousSystemToolInput {
    name: String!
    frameworks: [String!]!
    tool_type: String
    description: String
    handler: String
    input_schema: Mixed
    output_schema: Mixed
    requires_permission: Mixed
    version: String
    is_active: Boolean
    apps_id: Int
}

input UpdateNervousSystemToolInput {
    name: String!
    frameworks: [String!]!
    tool_type: String
    description: String
    handler: String
    input_schema: Mixed
    output_schema: Mixed
    requires_permission: Mixed
    version: String
    is_active: Boolean
}

input GrantNervousSystemCapabilityInput {
    agent_id: ID!
    expires_at: DateTime
    config: Mixed
}

extend type Query @guard {
    nervousSystemSkills(
        where: _
            @whereConditions(
                columns: ["id", "uuid", "name", "skill_type", "is_active"]
            )
        orderBy: _
            @orderBy(
                columns: ["id", "name", "version", "created_at", "updated_at"]
            )
    ): [NervousSystemSkill!]!
        @paginate(
            model: "Kanvas\\NervousSystem\\Capability\\Models\\Skill"
            scopes: ["fromApp", "active"]
            defaultCount: 50
        )

    nervousSystemTools(
        agent_type_id: ID
        framework: String
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "uuid"
                    "name"
                    "tool_type"
                    "tool_category_id"
                    "is_active"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "name"
                    "tool_category_id"
                    "version"
                    "created_at"
                    "updated_at"
                ]
            )
    ): [NervousSystemTool!]!
        @paginate(
            builder: "App\\GraphQL\\Intelligence\\Builders\\NervousSystem\\ToolsBuilder@getTools"
            defaultCount: 50
        )

    nervousSystemAgentSkills(agent_id: ID!): [NervousSystemAgentSkill!]!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Queries\\CapabilityQuery@agentSkills"
        )

    nervousSystemAgentTools(agent_id: ID!): [NervousSystemTool!]!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Queries\\CapabilityQuery@agentTools"
        )

    nervousSystemAgentCapabilities(
        agent_id: ID!
        framework: String
    ): NervousSystemAgentCapabilities!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Queries\\CapabilityQuery@agentCapabilities"
        )

    nervousSystemToolCategories(
        agent_type_id: ID
        framework: String
        where: _ @whereConditions(columns: ["id", "slug", "name", "is_active"])
        orderBy: _ @orderBy(columns: ["id", "display_order", "name", "slug"])
    ): [NervousSystemToolCategory!]!
        @paginate(
            builder: "App\\GraphQL\\Intelligence\\Builders\\NervousSystem\\ToolCategoriesBuilder@getCategories"
            defaultCount: 50
        )
}

extend type Mutation @guardByAdmin {
    """
    Force a re-read of an MCP server's tool list for one agent's connection. The cache is long-lived by
    design, so this is the escape hatch after a change on the vendor side.
    """
    refreshNervousSystemMcpTools(tool_id: ID!, agent_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\McpMutation@refreshTools"
        )

    """
    Connect an MCP server for one agent — connecting also turns the tool on for that agent. Token servers
    take `token` and connect immediately; OAuth servers return the consent URL, and the vendor redirects
    back to Kanvas, which stores the grant. `redirect_url` is where the browser lands afterwards, with
    `?status=success` or `?status=error&message=…` appended.
    """
    connectNervousSystemMcpServer(
        tool_id: ID!
        agent_id: ID!
        token: String
        "Required when the server's `url_per_connection` is true (https only); a reconnect may omit it to keep the stored one."
        server_url: String
        redirect_url: String
    ): NervousSystemMcpConnectResult!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\McpMutation@connectServer"
        )

    createNervousSystemSkill(
        input: CreateNervousSystemSkillInput!
    ): NervousSystemSkill!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@createSkill"
        )

    updateNervousSystemSkill(
        id: ID!
        input: UpdateNervousSystemSkillInput!
    ): NervousSystemSkill!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@updateSkill"
        )

    createNervousSystemTool(
        input: CreateNervousSystemToolInput!
    ): NervousSystemTool!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@createTool"
        )

    updateNervousSystemTool(
        id: ID!
        input: UpdateNervousSystemToolInput!
    ): NervousSystemTool!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@updateTool"
        )

    grantNervousSystemSkill(
        skill_id: ID!
        input: GrantNervousSystemCapabilityInput!
    ): NervousSystemAgentSkill!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@grantSkill"
        )

    revokeNervousSystemSkill(
        grant_id: ID!
        reason: String
    ): NervousSystemAgentSkill!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@revokeSkill"
        )

    attachNervousSystemToolToAgentType(
        tool_id: ID!
        agent_type_id: ID!
    ): NervousSystemTool!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@attachToolToAgentType"
        )

    detachNervousSystemToolFromAgentType(
        tool_id: ID!
        agent_type_id: ID!
    ): Boolean!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@detachToolFromAgentType"
        )

    "Idempotent per-agent toggle. enabled=true grants or reactivates the tool for the agent; enabled=false revokes it. Returns the resulting AgentTool grant row."
    setNervousSystemAgentTool(
        agent_id: ID!
        tool_id: ID!
        enabled: Boolean!
        config: Mixed
    ): NervousSystemAgentTool
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@setAgentTool"
        )

    createNervousSystemToolCategory(
        input: CreateNervousSystemToolCategoryInput!
    ): NervousSystemToolCategory!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@createToolCategory"
        )

    updateNervousSystemToolCategory(
        id: ID!
        input: UpdateNervousSystemToolCategoryInput!
    ): NervousSystemToolCategory!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Mutations\\CapabilityMutation@updateToolCategory"
        )
}

extend type Query @guardByAdmin {
    "Every agent's connection to one MCP server in the current company, for the integrations page."
    nervousSystemMcpConnections(tool_id: ID!): [NervousSystemMcpConnection!]!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Queries\\McpQuery@connections"
        )
}
