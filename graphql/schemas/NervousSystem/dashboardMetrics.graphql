enum NervousSystemDashboardPeriod {
    TODAY
    YESTERDAY
    THIS_WEEK
}

type NervousSystemDashboardMetrics {
    workforce_leverage: Float
    workforce_leverage_prior: Float
    human_equivalents: Float
    accomplishments_count: Int!
    accomplishments_count_prior: Int!
    mistakes_caught_count: Int!
    mistakes_auto_corrected: Int!
    mistakes_escalated: Int!
    time_recovered_hours: Float
    time_recovered_hours_prior: Float
    value_delivered_cents: Int
    value_delivered_cents_prior: Int
}

extend type Query @guard {
    nervousSystemDashboardMetrics(
        period: NervousSystemDashboardPeriod = TODAY
    ): NervousSystemDashboardMetrics!
        @field(
            resolver: "App\\GraphQL\\NervousSystem\\Queries\\DashboardMetricsQuery"
        )
}
