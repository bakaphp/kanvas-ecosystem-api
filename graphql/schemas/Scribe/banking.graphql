"Scribe.Banking — minimal bank-account surface backing GL Cash accounts."
type ScribeBankAccount {
    id: ID!
    uuid: String!
    account_name: String!
    account_number_last4: String
    routing_number_masked: String
    institution_name: String
    currency: String!
    gl_account: ScribeAccount! @belongsTo(relation: "glAccount")
    current_balance_native: Money
    available_balance_native: Money
    last_balance_sync_at: DateTime
    is_active: Boolean!
    source: String!
    external_id: String
    last_synced_at: DateTime
    metadata: Mixed
    company: Company! @belongsTo(relation: "company")
    user: User @belongsTo(relation: "user")
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
    created_at: DateTime!
    updated_at: DateTime!
}

input ScribeBankAccountInput {
    account_name: String!
    gl_account_id: Int!
    currency: String!
    account_number_last4: String
    routing_number_masked: String
    institution_name: String
    is_active: Boolean
    source: String
    external_id: String
    metadata: Mixed
}

enum ScribeBankTransactionDirection {
    DEBIT @enum(value: "debit")
    CREDIT @enum(value: "credit")
}

enum ScribeBankTransactionCategory {
    BANK_FEE @enum(value: "bank_fee")
    INTEREST_INCOME @enum(value: "interest_income")
    TRANSFER @enum(value: "transfer")
    UNKNOWN @enum(value: "unknown")
}

enum ScribeBankTransactionMatchStatus {
    UNMATCHED @enum(value: "unmatched")
    AUTO_MATCHED @enum(value: "auto_matched")
    MANUALLY_MATCHED @enum(value: "manually_matched")
    IGNORED @enum(value: "ignored")
}

enum ScribeBankTransactionMatchedToType {
    INVOICE_PAYMENT @enum(value: "invoice_payment")
    BILL_PAYMENT @enum(value: "bill_payment")
    EXPENSE @enum(value: "expense")
    TRANSFER @enum(value: "transfer")
    SALES_RECEIPT @enum(value: "sales_receipt")
}

enum ScribeBankTransactionMatchedBy {
    SYSTEM @enum(value: "system")
    AGENT @enum(value: "agent")
    HUMAN @enum(value: "human")
}

"A single line off a bank feed/statement, with whatever document was matched to it."
type ScribeBankTransaction {
    id: ID!
    uuid: String!
    bank_account: ScribeBankAccount! @belongsTo(relation: "bankAccount")
    posted_at: DateTime!
    transaction_date: Date!
    direction: ScribeBankTransactionDirection!
    amount_native: Money!
    currency: String!
    amount_base: Money!
    fx_rate_to_base: Float!
    counterparty_name: String
    counterparty_account_last4: String
    memo: String
    category: ScribeBankTransactionCategory!
    match_status: ScribeBankTransactionMatchStatus!
    matched_to_type: ScribeBankTransactionMatchedToType
    matched_at: DateTime
    matched_by: ScribeBankTransactionMatchedBy
    match_confidence: Float
    journal_entry: ScribeJournalEntry @belongsTo(relation: "journalEntry")
    source: String!
    external_id: String
    metadata: Mixed
    company: Company! @belongsTo(relation: "company")
    user: User @belongsTo(relation: "user")
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
    created_at: DateTime!
    updated_at: DateTime!
}

extend type Query @guard {
    scribeBankAccounts(
        where: _
            @whereConditions(
                columns: [
                    "account_name"
                    "currency"
                    "institution_name"
                    "is_active"
                ]
            )
        orderBy: _ @orderBy(columns: ["account_name", "created_at"])
    ): [ScribeBankAccount!]!
        @paginate(
            model: "Kanvas\\Scribe\\Banking\\Models\\BankAccount"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 25
        )

    scribeBankTransactions(
        where: _
            @whereConditions(
                columns: [
                    "bank_account_id"
                    "direction"
                    "category"
                    "match_status"
                    "currency"
                    "transaction_date"
                    "external_id"
                    "source"
                ]
            )
        orderBy: _
            @orderBy(columns: ["id", "transaction_date", "posted_at", "amount_base", "created_at"])
    ): [ScribeBankTransaction!]!
        @paginate(
            model: "Kanvas\\Scribe\\Banking\\Models\\BankTransaction"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 50
        )
}

extend type Mutation @guard {
    createScribeBankAccount(input: ScribeBankAccountInput!): ScribeBankAccount!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Banking\\BankAccountMutation@create"
        )
}
