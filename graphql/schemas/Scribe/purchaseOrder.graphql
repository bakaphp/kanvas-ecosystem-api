enum ScribePurchaseOrderStatus {
    DRAFT @enum(value: "draft")
    PENDING_APPROVAL @enum(value: "pending_approval")
    APPROVED @enum(value: "approved")
    SENT @enum(value: "sent")
    PARTIALLY_RECEIVED @enum(value: "partially_received")
    RECEIVED @enum(value: "received")
    CANCELLED @enum(value: "cancelled")
}

type ScribePurchaseOrder {
    id: ID!
    uuid: String!
    order_type: String!
    order_number: String!
    vendor: Organization @belongsTo(relation: "vendor")
    vendor_code: String
    "The status an ERP reports for a mirrored order; an order the company issues uses document_status."
    status: String
    "Empty on an order mirrored from an ERP."
    document_status: ScribePurchaseOrderStatus
    order_date: Date
    expected_date: Date
    currency: String
    notes: String
    approved_at: DateTime
    "When the order was emailed to the vendor, and to whom."
    sent_at: DateTime
    sent_to: String
    cancelled_at: DateTime
    cancel_reason: String
    order_total: Money!
    source: String!
    external_id: String
    last_synced_at: DateTime
    metadata: Mixed
    company: Company! @belongsTo(relation: "company")
    user: User @belongsTo(relation: "user")
    lines: [ScribePurchaseOrderLine!]! @hasMany(relation: "lines")
    files: [Filesystem!]!
        @cacheRedis
        @paginate(
            defaultCount: 25
            builder: "App\\GraphQL\\Ecosystem\\Queries\\Filesystem\\FilesystemQuery@getFileByGraphType"
        )
    created_at: DateTime!
    updated_at: DateTime!
}

type ScribePurchaseOrderLine {
    id: ID!
    line_number: Int!
    sku: String
    description: String
    order_qty: Float!
    open_qty: Float!
    received_qty: Float!
    unit_cost: Float!
    ext_cost: Money!
    metadata: Mixed
}

input ScribePurchaseOrderLineInput {
    description: String!
    quantity: Float!
    unit_cost: Float!
    sku: String
    inventory_variant_id: ID
    expense_account_id: ID
    subaccount_id: ID
}

input ScribePurchaseOrderInput {
    vendor_id: ID!
    currency: String!
    order_date: Date
    expected_date: Date
    notes: String
    lines: [ScribePurchaseOrderLineInput!]!
}

"Only what is sent changes; sending lines replaces all of them."
input UpdateScribePurchaseOrderInput {
    vendor_id: ID
    currency: String
    order_date: Date
    expected_date: Date
    notes: String
    lines: [ScribePurchaseOrderLineInput!]
}

extend type Mutation @guard {
    "Creates a draft purchase order numbered from the company's own sequence."
    createScribePurchaseOrder(input: ScribePurchaseOrderInput!): ScribePurchaseOrder!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Purchasing\\PurchaseOrderMutation@create"
        )
    "Edits a draft purchase order the company issued."
    updateScribePurchaseOrder(id: ID!, input: UpdateScribePurchaseOrderInput!): ScribePurchaseOrder!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Purchasing\\PurchaseOrderMutation@update"
        )
    "Submits a draft for approval; the vendor's approver is asked. Needs an approval policy for purchase orders."
    submitScribePurchaseOrderForApproval(id: ID!): ScribePurchaseOrder!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Purchasing\\PurchaseOrderMutation@submit"
        )
    "Approves an order pending approval. Only an approver of the vendor can."
    approveScribePurchaseOrder(id: ID!, comment: String): ScribePurchaseOrder!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Purchasing\\PurchaseOrderMutation@approve"
        )
    "Rejects an order pending approval; it goes back to draft with the reason in its notes."
    rejectScribePurchaseOrder(id: ID!, reason: String!): ScribePurchaseOrder!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Purchasing\\PurchaseOrderMutation@reject"
        )
    "Emails an approved order to the vendor as a PDF and marks it sent. A sent order can be sent again."
    sendScribePurchaseOrder(id: ID!, to: [String!]!, message: String): ScribePurchaseOrder!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Purchasing\\PurchaseOrderMutation@send"
        )
    "Renders the order as a PDF and attaches it to the order."
    generateScribePurchaseOrderPdf(id: ID!): Filesystem!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Purchasing\\PurchaseOrderMutation@generatePdf"
        )
    "Cancels a purchase order the company issued, as long as no goods have arrived against it."
    cancelScribePurchaseOrder(id: ID!, reason: String): ScribePurchaseOrder!
        @field(
            resolver: "App\\GraphQL\\Scribe\\Mutations\\Purchasing\\PurchaseOrderMutation@cancel"
        )
}

extend type Query @guard {
    scribePurchaseOrders(
        where: _
            @whereConditions(
                columns: [
                    "order_number"
                    "order_type"
                    "status"
                    "document_status"
                    "currency"
                    "vendor_organization_id"
                    "vendor_code"
                    "order_date"
                    "source"
                ]
            )
        orderBy: _
            @orderBy(
                columns: [
                    "id"
                    "order_number"
                    "order_date"
                    "order_total"
                    "created_at"
                ]
            )
    ): [ScribePurchaseOrder!]!
        @paginate(
            model: "Kanvas\\Scribe\\Purchasing\\Models\\PurchaseOrder"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 50
        )
}
