"Scribe.Payment — accounting-side money-movement record. Distinct from Souk.Payments (cart commerce)."
enum ScribePaymentDirection {
    INBOUND @enum(value: "inbound")
    OUTBOUND @enum(value: "outbound")
}

enum ScribePaymentMethod {
    WIRE @enum(value: "wire")
    ACH @enum(value: "ach")
    CHECK @enum(value: "check")
    CASH @enum(value: "cash")
    CARD @enum(value: "card")
    STRIPE @enum(value: "stripe")
    MERCURY_MATCH @enum(value: "mercury_match")
    ADM_SYNC @enum(value: "adm_sync")
    MANUAL @enum(value: "manual")
    PDF_INGEST_AUTO @enum(value: "pdf_ingest_auto")
}

enum ScribePaymentStatus {
    PENDING @enum(value: "pending")
    CLEARED @enum(value: "cleared")
    FAILED @enum(value: "failed")
    REVERSED @enum(value: "reversed")
}

type ScribePayment {
    id: ID!
    uuid: String!
    amount_native: Money!
    amount_base: Money!
    currency: String!
    fx_rate_to_base: Float!
    fx_rate_at: DateTime
    payment_date: Date!
    cleared_at: DateTime
    reconciled_at: DateTime
    direction: ScribePaymentDirection!
    method: ScribePaymentMethod!
    status: ScribePaymentStatus!
    bank_account: ScribeBankAccount @belongsTo(relation: "bankAccount")
    reference: String
    notes: String
    source: String!
    external_id: String
    external_url: String
    reversed_at: DateTime
    reversed_by: User @belongsTo(relation: "reversedBy")
    reversal_reason: String
    metadata: Mixed
    user: User @belongsTo(relation: "user")
    company: Company! @belongsTo(relation: "company")
    created_at: DateTime!
    updated_at: DateTime!
}

input ScribeAllocatePaymentInput {
    amount_native: Float!
    method: ScribePaymentMethod
    cash_account_sub_type: String
    bank_account_id: Int
    reference: String
    paid_at: DateTime
    source: String
    metadata: Mixed
}

extend type Query @guard {
    scribePayments(
        where: _
            @whereConditions(
                columns: [
                    "direction"
                    "method"
                    "status"
                    "currency"
                    "payment_date"
                    "bank_account_id"
                    "source"
                    "external_id"
                ]
            )
        orderBy: _ @orderBy(columns: ["payment_date", "id", "created_at"])
    ): [ScribePayment!]!
        @paginate(
            model: "Kanvas\\Scribe\\Payments\\Models\\Payment"
            scopes: ["fromApp", "fromCompany", "notDeleted"]
            defaultCount: 50
        )
}
