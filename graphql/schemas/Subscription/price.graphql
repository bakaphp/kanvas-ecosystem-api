type Price {
    id: ID!
    apps_plans_id: ID! @belongsTo(relation: "plan")
    stripe_id: String
    amount: Money!
    currency: String!
    interval: String!
    is_active: Boolean
    is_default: Boolean
    created_at: String
    updated_at: String
}

input PriceInput {
    apps_plans_id: ID
    amount: Float!
    currency: String!
    interval: String!
    is_default: Boolean
    is_active: Boolean
}

input PriceUpdateInput {
    is_active: Boolean
}

extend type Mutation @guardByAppKey {
    createPrice(input: PriceInput!): Price!
        @requiresStripeConfiguration
        @field(
            resolver: "App\\GraphQL\\Subscription\\Mutations\\Prices\\PriceMutation@create"
        )
    updatePrice(id: ID!, input: PriceUpdateInput!): Price!
        @requiresStripeConfiguration
        @field(
            resolver: "App\\GraphQL\\Subscription\\Mutations\\Prices\\PriceMutation@update"
        )
}
