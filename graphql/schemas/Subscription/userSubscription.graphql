type UserSubscription {
    id: ID!
    type: String
    provider: String
    stripe_id: ID!
    stripe_status: String!
    stripe_price: String
    items: [SubscriptionItem!]! @hasMany(relation: "items")
    quantity: Int!
    trial_ends_at: DateTime
    ends_at: DateTime
    created_at: String
    updated_at: String
}

extend type Query @guard {
    userSubscription(id: ID!): UserSubscription!
        @field(
            resolver: "App\\GraphQL\\Subscription\\Queries\\UserSubscriptionQuery@getById"
        )
}
