# Universal Seguros (Unit ServicePlattform) Auto-insurance connector.
# Setup is done via the generic createIntegrationCompany mutation (handler =
# UniversalSegurosHandler). Reference catalogs are live-queryable; quote/pay/emit
# operate on a Souk Order.
extend type Query @guard {
    universalSegurosVehicleModels(marca: String = "", modelo: String = ""): Mixed
        @field(
            resolver: "App\\GraphQL\\Connector\\UniversalSeguros\\Queries\\UniversalSegurosReferenceQuery@vehicleModels"
        )
    universalSegurosProvincias: Mixed
        @field(
            resolver: "App\\GraphQL\\Connector\\UniversalSeguros\\Queries\\UniversalSegurosReferenceQuery@provincias"
        )
    universalSegurosMunicipios(provincia: String!): Mixed
        @field(
            resolver: "App\\GraphQL\\Connector\\UniversalSeguros\\Queries\\UniversalSegurosReferenceQuery@municipios"
        )
    universalSegurosSectores(provincia: String!, municipio: String!): Mixed
        @field(
            resolver: "App\\GraphQL\\Connector\\UniversalSeguros\\Queries\\UniversalSegurosReferenceQuery@sectores"
        )
    universalSegurosAditamentos: Mixed
        @field(
            resolver: "App\\GraphQL\\Connector\\UniversalSeguros\\Queries\\UniversalSegurosReferenceQuery@aditamentos"
        )
}

extend type Mutation @guard {
    universalSegurosCreateQuote(order_id: ID!, product: String!, input: Mixed!): Mixed
        @field(
            resolver: "App\\GraphQL\\Connector\\UniversalSeguros\\Mutations\\UniversalSegurosMutation@createQuote"
        )
    universalSegurosRequestPaymentLink(order_id: ID!, by_email: Boolean = false): Mixed
        @field(
            resolver: "App\\GraphQL\\Connector\\UniversalSeguros\\Mutations\\UniversalSegurosMutation@requestPaymentLink"
        )
    universalSegurosEmitPolicy(order_id: ID!): Mixed
        @field(
            resolver: "App\\GraphQL\\Connector\\UniversalSeguros\\Mutations\\UniversalSegurosMutation@emitPolicy"
        )
}
