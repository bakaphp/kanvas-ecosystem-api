type TwilioPhoneNumber {
    phone_number: String!
    friendly_name: String
    sid: String!
}

extend type Query @guard {
    "List the company's AVAILABLE (purchased, unassigned) Twilio numbers, to pick from when configuring an agent's voice. Pass agent_uuid when editing an agent so its own number stays listed."
    twilioAvailablePhoneNumbers(agent_uuid: String): [TwilioPhoneNumber!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\Twilio\\Queries\\TwilioPhoneNumbersQuery@available"
        )
}

extend type Mutation @guard {
    "Send a failed or undelivered SMS again, as the same message: same text and attachments, same number. The result arrives like any send — in `message.delivery` and the `message.delivery.updated` Pusher event."
    twilioResendMessage(message_id: ID!): Message!
        @field(
            resolver: "App\\GraphQL\\Connector\\Twilio\\Mutations\\TwilioMessageMutation@resend"
        )
}
