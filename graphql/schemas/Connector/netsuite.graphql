input NetSuiteImportLocationsInput {
    "Mapped onto the company's existing default warehouse, where products already sit and new ones are created."
    default_location_id: ID!
    "Further locations, each created as its own warehouse."
    location_ids: [ID!] = []
}

extend type Mutation @guardByAdmin {
    "Maps the chosen NetSuite locations onto warehouses; returns the default warehouse first. Safe to run again."
    netsuiteImportLocations(input: NetSuiteImportLocationsInput!): [Warehouse!]!
        @field(resolver: "App\\GraphQL\\Connector\\NetSuite\\Mutations\\NetSuiteImportMutation@importLocations")
}
