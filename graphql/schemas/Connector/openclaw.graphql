input MigrateAgentWorkspaceInput {
    source_deployment_id: ID!
    destination_machine_id: ID!
    "Full path to the workspace directory on the source server (defaults to ~/.openclaw)"
    source_path: String
    "Parent directory to extract into on the destination server (defaults to agent home directory)"
    destination_path: String
}

type AgentDeploymentEvent {
    "Auto-increment primary key"
    id: ID!
    "ID of the AgentDeployment this event belongs to"
    deployment_id: ID!
    "One of: gateway_down | gateway_up | health_fail | health_recover | session_started | agent_unreachable"
    event_type: String!
    "JSON-encoded map of contextual values that triggered the event (previous/current states, counts, errors)"
    payload: String
    "ISO-8601 timestamp when the event occurred"
    occurred_at: String!
}

type AgentLogEntry {
    "ISO-8601 timestamp from the log line, empty string when unavailable"
    ts: String!
    "Log level: debug | info | warn | error"
    level: String!
    "Human-readable log message"
    msg: String!
    "JSON-encoded map of any extra structured fields present in the log line"
    meta: String
}

extend type Query @guardByAdmin {
    agentCurrentTelemetry(deployment_id: ID!): AgentTelemetryData
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Queries\\AgentTelemetryQuery"
        )

    agentDeploymentLogs(
        "ID of the AgentDeployment to fetch logs for"
        deployment_id: ID!
        "Maximum number of log lines to return (default 100, max 500)"
        limit: Int
    ): [AgentLogEntry!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Queries\\AgentDeploymentLogsQuery"
        )

    agentDeploymentEvents(
        "ID of the AgentDeployment to fetch events for"
        deployment_id: ID!
        "Maximum number of events to return, newest first (default 50, max 200)"
        limit: Int
    ): [AgentDeploymentEvent!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Queries\\AgentDeploymentEventsQuery"
        )
}

extend type Subscription {
    agentTelemetry(deployment_id: ID!): AgentTelemetryData
        @subscription(
            class: "App\\GraphQL\\Connector\\OpenClaw\\Subscriptions\\AgentTelemetrySubscription"
        )
}

extend type Mutation @guardByAdmin {
    openclawCreateMachine(input: AgentMachineInput!): AgentMachineType!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentMachineMutation@create"
        )
    openclawUpdateMachine(id: ID!, input: UpdateAgentMachineInput!): AgentMachineType!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentMachineMutation@update"
        )
    openclawDeleteMachine(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentMachineMutation@delete"
        )
    openclawUpdateMachineContainers(machine_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentMachineMutation@updateContainers"
        )

    openclawLaunchAgent(input: LaunchAgentInput!): AgentDeploymentType!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@launch"
        )
    openclawTerminateAgent(deployment_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@terminate"
        )
    openclawRestartContainer(deployment_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@restart"
        )
    openclawContainerLogs(deployment_id: ID!, lines: Int): String!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@logs"
        )
    openclawContainerStatus(deployment_id: ID!): AgentDeploymentType!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@status"
        )
    openclawCollectUsage(deployment_id: ID!): AgentUsageSnapshot!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@collectUsage"
        )

    openclawSetSlackTokens(agent_id: ID!, slack_bot_token: String!, slack_app_token: String!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@setSlackTokens"
        )

    openclawSetTelegramToken(agent_id: ID!, telegram_bot_token: String!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@setTelegramToken"
        )

    openclawMigrateAgentWorkspace(input: MigrateAgentWorkspaceInput!): AgentDeploymentType!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@migrateWorkspace"
        )
}

extend type Mutation @guardByAppKey {
    openclawExecCommand(deployment_id: ID!, command: String!, session_id: String!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@execCommand"
        )
    openclawGetConfig(deployment_id: ID!): String!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@getConfig"
        )
    openclawUpdateConfig(deployment_id: ID!, config: String!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\OpenClaw\\Mutations\\AgentDeploymentMutation@updateConfig"
        )
}
