input CorrectVehiclePlateInput {
    new_plate: String!
    reason: String!
    evidence_urls: [String!]
}

extend type Mutation @guard {
    impoundCorrectPlate(
        order_id: ID!
        input: CorrectVehiclePlateInput!
    ): Order!
        @can(
            ability: "correct-plate"
            model: "Kanvas\\Souk\\Orders\\Models\\Order"
        )
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\ImpoundCorrectionsMutation@correctPlate"
        )
}
