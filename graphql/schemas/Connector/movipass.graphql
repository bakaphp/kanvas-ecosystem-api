enum ParkingGateCode {
    PAID
    ENTRY_OK
    EXIT_OK
    NOT_FOUND
    ALREADY_USED
    ALREADY_INSIDE
    INSUFFICIENT_FUNDS
    NOT_PAID
    EXPIRED
    FAILED
}

type ParkingGateResponse {
    success: Boolean!
    message: String!
    code: ParkingGateCode!
    order_id: ID
    transaction_id: String
    amount_charged: Float
}

extend type Mutation @guardByAppKey {
    movipassValidateParkingFinePayment(
        token: String!
        lot_id: String
    ): ParkingGateResponse!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\ParkingMutation@validateFinePayment"
        )

    movipassNotifyParkingEntry(
        qr_code: String!
        lot_id: String
    ): ParkingGateResponse!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\ParkingMutation@notifyEntry"
        )

    movipassValidateParkingExit(
        qr_code: String!
        amount: Float!
        lot_id: String
    ): ParkingGateResponse!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\ParkingMutation@validateExit"
        )
}

extend type Query @guard {
    mechanicOrders(
        all: Boolean
        mechanic_id: ID
        provider_id: ID
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "users_id"
                    "created_at"
                    "updated_at"
                    "fulfillment_status"
                ]
            )
        orderStatus: _
            @whereConditions(
                columns: ["name", "slug", "order_type_id", "id"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderStatusHandler"
            )
        orderBy: _
            @orderBy(columns: ["id", "created_at", "updated_at"])
    ): [Order!]!
        @paginate(
            builder: "App\\GraphQL\\Connector\\Movipass\\Builders\\MechanicOrdersBuilder@build"
            defaultCount: 25
        )
}
