enum MechanicFilterEnum {
    NOTIFIED
    ASSIGNED
}

type RoadsideAssistanceMetrics {
    period: Period!
    totalCases: Int!
    resolvedCases: Int!
    unresolvedCompletedCases: Int!
    cancelledCases: Int!
    avgResolutionSeconds: Float
    avgResolutionHours: Float
    avgResponseSeconds: Float
    avgResponseHours: Float
}

input RoadsideAssistanceMetricsInput {
    startDate: String
    endDate: String
    provider_company_id: ID
    company_id: ID
}

input CorporateOnboardingInput {
    legal_name: String!
    commercial_name: String
    rnc: String!
    contact_name: String!
    contact_role: String
    contact_email: String!
    contact_phone: String
    region_id: ID
}

type CorporateOnboardingResult {
    company: Company!
    status: String!
}

extend type Mutation @guard {
    enableCorporateMode(
        input: CorporateOnboardingInput!
    ): CorporateOnboardingResult!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\EnableCorporateModeMutation@enable"
        )

    setMechanicServiceType(
        id: ID!
        service_type: String!
    ): User!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\MechanicMutation@setServiceType"
        )
}

enum MechanicAvailabilityEnum {
    ACTIVO
    NO_DISPONIBLE
}

enum MechanicWhereColumn {
    ID @enum(value: "users.id")
    FIRSTNAME @enum(value: "users.firstname")
    LASTNAME @enum(value: "users.lastname")
    EMAIL @enum(value: "users.email")
    CREATED_AT @enum(value: "users.created_at")
}

extend type Query @guard {
    mechanics(
        company_id: ID
        availability: MechanicAvailabilityEnum
        service_type: String
        where: _
            @whereConditions(columnsEnum: MechanicWhereColumn)
        orderBy: _
            @orderBy(columns: ["id", "firstname", "lastname", "created_at"])
    ): [User!]!
        @paginate(
            builder: "App\\GraphQL\\Connector\\Movipass\\Builders\\MechanicsBuilder@build"
            defaultCount: 25
        )

    roadsideAssistanceMetrics(input: RoadsideAssistanceMetricsInput): RoadsideAssistanceMetrics!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideAssistanceMetricsQuery@get"
        )

    mechanicOrders(
        all: Boolean
        mechanic_id: ID
        mechanic_filter: MechanicFilterEnum
        provider_id: ID
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "users_id"
                    "created_at"
                    "updated_at"
                    "fulfillment_status"
                ]
            )
        orderStatus: _
            @whereConditions(
                columns: ["name", "slug", "order_type_id", "id"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderStatusHandler"
            )
        orderBy: _
            @orderBy(columns: ["id", "created_at", "updated_at"])
    ): [Order!]!
        @paginate(
            builder: "App\\GraphQL\\Connector\\Movipass\\Builders\\MechanicOrdersBuilder@build"
            defaultCount: 25
        )

    exportMechanicOrders(
        format: ExportFormat!
        all: Boolean
        mechanic_id: ID
        mechanic_filter: MechanicFilterEnum
        provider_id: ID
        field_mapper: Mixed
        metadata: ExportMetadataInput
        timezone: String
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "users_id"
                    "created_at"
                    "updated_at"
                    "fulfillment_status"
                ]
            )
        orderStatus: _
            @whereConditions(
                columns: ["name", "slug", "order_type_id", "id"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderStatusHandler"
            )
        orderBy: _
            @orderBy(columns: ["id", "created_at", "updated_at"])
    ): OrderExportResult!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\ExportMechanicOrdersQuery@export"
        )

    exportMechanics(
        format: ExportFormat!
        company_id: ID
        availability: MechanicAvailabilityEnum
        service_type: String
        field_mapper: Mixed
        metadata: ExportMetadataInput
        timezone: String
        where: _
            @whereConditions(columnsEnum: MechanicWhereColumn)
        orderBy: _
            @orderBy(columns: ["id", "firstname", "lastname", "created_at"])
    ): OrderExportResult!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\ExportMechanicsQuery@export"
        )
}

enum RoadsideServiceTypeEnum {
    jump_start
    fuel_delivery
    light_tow
    designated_driver
    tire_change
    accident_tow
    motorcycle_tow
    locksmith
}

type RoadsideIntakeField {
    key: String!
    label: String!
    "One of: text, boolean, number, choice, datetime"
    type: String!
    required: Boolean!
    "Allowed values, populated for choice fields only"
    options: [String!]!
    "Key of the field that has to answer true (or required_when_value) before this one is required"
    required_when: String
    "When set, required_when must answer this value instead of true"
    required_when_value: String
    hint: String
}

type RoadsideServiceIntake {
    service_type: String!
    label: String!
    "Whether the case is rejected without at least one photo attached"
    requires_photos: Boolean!
    "Asked for every service before the service-specific block"
    general_fields: [RoadsideIntakeField!]!
    service_fields: [RoadsideIntakeField!]!
}

type RoadsideNotProceedReason {
    value: String!
    label: String!
}

extend type Query @guard {
    "The operator intake script: the shared questions plus the per-service block. Omit service_type to get every service."
    roadsideAssistanceIntake(service_type: RoadsideServiceTypeEnum): [RoadsideServiceIntake!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideIntakeQuery@get"
        )

    "Reasons a case can be declined at the authorization gate."
    roadsideAssistanceNotProceedReasons: [RoadsideNotProceedReason!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideIntakeQuery@notProceedReasons"
        )

    """
    Runs the discard rules on the intake answers before the user pays: proceed, cabin_review
    (paid but held for the cabin before dispatch) or not_proceed (no payment; show the reasons and,
    when set, offer recommended_service instead).
    """
    evaluateRoadsideIntake(service_type: RoadsideServiceTypeEnum!, answers: JSON!): RoadsideIntakeVerdict!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideIntakeQuery@evaluate"
        )
}

type RoadsideIntakeVerdict {
    "One of: proceed, cabin_review, not_proceed"
    outcome: String!
    reasons: [String!]!
    recommended_service: String
}

input RoadsideCoordinatesInput {
    lat: Float!
    lng: Float!
}

input RoadsideQuoteInput {
    service_type: RoadsideServiceTypeEnum!
    "Where the user is; decides the zone, and the billable distance for on-site services"
    location: RoadsideCoordinatesInput!
    "Drop-off point; required for tows and designated driver, where it decides the billable distance"
    destination: RoadsideCoordinatesInput
    "Defaults to now; decides the peak-hour, late-night and holiday surcharge"
    requested_at: DateTime
}

type RoadsideQuote {
    service_type: String!
    "One of: amss, other_city, foraneo"
    zone: String!
    base_fare: Float!
    "Straight-line km from Kilómetro Cero to the billed point"
    distance_km: Float!
    included_km: Float!
    billable_km: Int!
    per_km_rate: Float
    extra_km_amount: Float!
    additional_charges: Float!
    "Every condition that matched; the surcharge is applied once regardless of how many"
    surcharge_reasons: [String!]!
    subtotal: Float!
    surcharge_rate: Float!
    surcharge_amount: Float!
    taxable_base: Float!
    tax_rate: Float!
    tax_amount: Float!
    total: Float!
    quoted_at: String!
}

enum RoadsideAdditionalChargeConceptEnum {
    fuel
}

input RoadsideAdditionalChargeInput {
    order_id: ID!
    concept: RoadsideAdditionalChargeConceptEnum!
    "Real amount the technician paid, before surcharge and tax"
    amount: Float!
    notes: String
}

type RoadsideAdditionalCharge {
    id: String!
    concept: String!
    amount: Float!
    subtotal: Float!
    surcharge_rate: Float!
    surcharge_amount: Float!
    taxable_base: Float!
    tax_rate: Float!
    tax_amount: Float!
    total: Float!
    "One of: pending, approved, rejected, cancelled"
    status: String!
    "The child order the user pays through the normal order payment flow"
    order_id: ID!
    order_uuid: String!
    notes: String
    registered_at: String!
}

extend type Query @guard {
    "Prices a roadside service from the tariff sheet: base fare, km beyond the included ones, one surcharge and VAT."
    roadsideAssistanceQuote(input: RoadsideQuoteInput!): RoadsideQuote!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideQuoteQuery@get"
        )
}

extend type Mutation @guard {
    """
    Prices the user's roadside order from the tariff sheet right now. Call it after
    createOrderFromCart and before addPaymentToOrder: the payment must be opened for the
    total this returns, or it is refused before the card is charged.
    """
    priceRoadsideAssistanceOrder(order_id: ID!): Order!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideOrderPricingMutation@price"
        )

    "Cabin bills an additional charge (fuel) on an open case; the user pays it before the technician supplies it."
    addRoadsideAdditionalCharge(input: RoadsideAdditionalChargeInput!): RoadsideAdditionalCharge!
        @can(ability: "edit", model: "Kanvas\\Souk\\Orders\\Models\\Order")
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideAdditionalChargeMutation@add"
        )
}

enum RoadsideTechnicianDeclineReasonEnum {
    unit_unavailable
    out_of_coverage
    incompatible_vehicle
    technical_issue
    operational_emergency
    other
}

enum RoadsideEvidencePhaseEnum {
    before
    after
}

type RoadsideTrackingResult {
    "Straight-line meters to the user location, null when the case has no location"
    distance_meters: Float
    "The homologated case state after this point was recorded"
    state: String
}

type RoadsideEvidenceSummary {
    required_per_phase: Int!
    before: Int!
    after: Int!
    has_comment: Boolean!
    "Empty when the case may close"
    missing_for_closing: [String!]!
}

type RoadsideSlaMetric {
    "One of: dispatch, cabin_review, acceptance, reassignment, arrival, resolution, incident"
    metric: String!
    started_at: String!
    ended_at: String
    minutes: Float!
    threshold_minutes: Float!
    running: Boolean!
    breached: Boolean!
}

type RoadsideSlaSummary {
    metric: String!
    cases: Int!
    average_minutes: Float!
    breached: Int!
}

type RoadsideAuditEntry {
    id: String!
    occurred_at: String
    event_type: String!
    "success or error"
    result: String!
    "user or system"
    actor_type: String
    actor_id: Int
    actor_name: String
    module: String
    action: String
    "One of: web, apk, app, api, system"
    channel: String
    reason: String
    before: Mixed
    after: Mixed
    ip: String
    device: String
}

type RoadsideProviderSyncEvent {
    id: String!
    type: String!
    payload: Mixed
    "One of: pending, sent, failed, skipped"
    status: String!
    attempts: Int!
    last_error: String
    created_at: String
    updated_at: String
}

type RoadsideProviderSyncStatus {
    last_error: String
    events: [RoadsideProviderSyncEvent!]!
}

type RoadsideTariffVersion {
    effective_from: String!
    tariffs: Mixed
    reason: String!
    users_id: Int!
    created_at: String!
}

input RoadsideEvidenceInput {
    order_id: ID!
    phase: RoadsideEvidencePhaseEnum
    "Filesystem uuids of photos taken with the APK camera"
    file_uuids: [String!]
    "Operative comment; internal, never shown to the user"
    comment: String
    source: String
}

input RoadsideReassignInput {
    order_id: ID!
    reason: String!
    "Hand the case to this technician; omit to send it back to the pool"
    technician_id: ID
    "Limit who may take the case; an empty list clears the limit"
    eligible_technician_ids: [ID!]
}

input RoadsideTariffsInput {
    "Same shape as the movipass_roadside_tariffs setting; omitted keys keep the launch defaults"
    tariffs: JSON!
    reason: String!
    "Defaults to now; cannot be in the past"
    effective_from: DateTime
}

extend type Query @guard {
    "Immutable audit trail of an Asistencia Regional case, newest first."
    roadsideAssistanceAuditLog(order_id: ID!): [RoadsideAuditEntry!]!
        @can(ability: "edit", model: "Kanvas\\Souk\\Orders\\Models\\Order")
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideRegionalQuery@auditLog")

    "Every tariff change with its previous and new values."
    roadsideTariffAuditLog: [RoadsideAuditEntry!]!
        @guardByAdmin
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideRegionalQuery@tariffAuditLog")

    roadsideTariffVersions: [RoadsideTariffVersion!]!
        @guardByAdmin
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideRegionalQuery@tariffVersions")

    "Stage durations of one case against their SLA thresholds."
    roadsideAssistanceSla(order_id: ID!): [RoadsideSlaMetric!]!
        @can(ability: "edit", model: "Kanvas\\Souk\\Orders\\Models\\Order")
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideRegionalQuery@sla")

    "Average stage durations and breaches for the cases created in the period."
    roadsideAssistanceSlaSummary(from: DateTime!, to: DateTime!): [RoadsideSlaSummary!]!
        @can(ability: "edit", model: "Kanvas\\Souk\\Orders\\Models\\Order")
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideRegionalQuery@slaSummary")

    "What was sent to Asistencia Regional for a case, what failed and why."
    roadsideProviderSyncStatus(order_id: ID!): RoadsideProviderSyncStatus!
        @can(ability: "edit", model: "Kanvas\\Souk\\Orders\\Models\\Order")
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideRegionalQuery@providerSync")

    "Evidence collected so far and what still blocks closing."
    roadsideAssistanceEvidence(order_id: ID!): RoadsideEvidenceSummary!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideRegionalQuery@evidence")
}

extend type Mutation @guard {
    "Technician (APK): take an offered case. The first to accept gets it."
    acceptRoadsideOffer(order_id: ID!): Order!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@acceptOffer")

    "Technician (APK): turn an offer down. A comment is required when the reason is other."
    rejectRoadsideOffer(order_id: ID!, reason: RoadsideTechnicianDeclineReasonEnum!, comment: String): Order!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@rejectOffer")

    "Technician (APK): drop an accepted case. The order is reassigned, never cancelled."
    cancelRoadsideAttention(order_id: ID!, reason: RoadsideTechnicianDeclineReasonEnum!, comment: String!): Order!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@cancelAttention")

    "Technician (APK): go online or offline. Offline is refused with a case in progress."
    setRoadsideTechnicianAvailability(online: Boolean!): String!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@setAvailability")

    "Technician (APK): a live GPS point for the assigned case."
    trackRoadsideTechnician(order_id: ID!, lat: Float!, lng: Float!): RoadsideTrackingResult!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@track")

    "Technician (APK): validate the 4-digit PIN to start the service. Every attempt is recorded."
    validateRoadsideAssistancePin(order_id: ID!, pin: String!): Order!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@validatePin")

    "Technician (APK): add before/after photos and/or the operative comment."
    addRoadsideEvidence(input: RoadsideEvidenceInput!): RoadsideEvidenceSummary!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@addEvidence")

    "Technician (APK): close as resolved or not resolved (reason required). Final."
    closeRoadsideService(order_id: ID!, resolved: Boolean!, reason: String): Order!
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@close")

    "Cabin: approve a held case (offers it to technicians) or decline it (flags a refund)."
    resolveRoadsideCabinReview(order_id: ID!, approved: Boolean!, reason: String): Order!
        @can(ability: "edit", model: "Kanvas\\Souk\\Orders\\Models\\Order")
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@resolveCabinReview")

    "Cabin: release the current technician, limit who may take the case, or hand it to one technician."
    reassignRoadsideAssistance(input: RoadsideReassignInput!): Order!
        @can(ability: "edit", model: "Kanvas\\Souk\\Orders\\Models\\Order")
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@reassign")

    "Cabin: re-queue the provider sync events that failed. Returns how many were re-queued."
    retryRoadsideProviderSync(order_id: ID!): Int!
        @can(ability: "edit", model: "Kanvas\\Souk\\Orders\\Models\\Order")
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@retryProviderSync")

    "Admin: append a tariff version with its effective date and reason. Paid orders keep their price."
    updateRoadsideTariffs(input: RoadsideTariffsInput!): RoadsideTariffVersion!
        @guardByAdmin
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\RoadsideRegionalMutation@updateTariffs")
}

enum ParkingState {
    IN_PROGRESS @enum(value: "in_progress")
    PAYMENT_APPROVED @enum(value: "payment_approved")
    PENDING_CONFIRMATION @enum(value: "pending_confirmation")
    EXIT_ENABLED @enum(value: "exit_enabled")
    FINISHED @enum(value: "finished")
    CANCELLED @enum(value: "cancelled")
}

extend type Order {
    parking_state: ParkingState
        @field(resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\ParkingStateField")
}

extend type Mutation @guard {
    quoteParkingExit(order_id: ID!): Order!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\ParkingExitMutation@quote"
        )
}
