enum MechanicFilterEnum {
    NOTIFIED
    ASSIGNED
}

type RoadsideAssistanceMetrics {
    period: Period!
    totalCases: Int!
    resolvedCases: Int!
    unresolvedCompletedCases: Int!
    cancelledCases: Int!
    avgResolutionSeconds: Float
    avgResolutionHours: Float
    avgResponseSeconds: Float
    avgResponseHours: Float
}

input RoadsideAssistanceMetricsInput {
    startDate: String
    endDate: String
    provider_company_id: ID
    company_id: ID
}

input CorporateOnboardingInput {
    legal_name: String!
    commercial_name: String
    rnc: String!
    contact_name: String!
    contact_role: String
    contact_email: String!
    contact_phone: String
    region_id: ID
}

type CorporateOnboardingResult {
    company: Company!
    status: String!
}

extend type Mutation @guard {
    enableCorporateMode(
        input: CorporateOnboardingInput!
    ): CorporateOnboardingResult!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\EnableCorporateModeMutation@enable"
        )

    setMechanicServiceType(
        id: ID!
        service_type: String!
    ): User!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Mutations\\MechanicMutation@setServiceType"
        )
}

enum MechanicAvailabilityEnum {
    ACTIVO
    NO_DISPONIBLE
}

enum MechanicWhereColumn {
    ID @enum(value: "users.id")
    FIRSTNAME @enum(value: "users.firstname")
    LASTNAME @enum(value: "users.lastname")
    EMAIL @enum(value: "users.email")
    CREATED_AT @enum(value: "users.created_at")
}

extend type Query @guard {
    mechanics(
        company_id: ID
        availability: MechanicAvailabilityEnum
        service_type: String
        where: _
            @whereConditions(columnsEnum: MechanicWhereColumn)
        orderBy: _
            @orderBy(columns: ["id", "firstname", "lastname", "created_at"])
    ): [User!]!
        @paginate(
            builder: "App\\GraphQL\\Connector\\Movipass\\Builders\\MechanicsBuilder@build"
            defaultCount: 25
        )

    roadsideAssistanceMetrics(input: RoadsideAssistanceMetricsInput): RoadsideAssistanceMetrics!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideAssistanceMetricsQuery@get"
        )

    mechanicOrders(
        all: Boolean
        mechanic_id: ID
        mechanic_filter: MechanicFilterEnum
        provider_id: ID
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "users_id"
                    "created_at"
                    "updated_at"
                    "fulfillment_status"
                ]
            )
        orderStatus: _
            @whereConditions(
                columns: ["name", "slug", "order_type_id", "id"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderStatusHandler"
            )
        orderBy: _
            @orderBy(columns: ["id", "created_at", "updated_at"])
    ): [Order!]!
        @paginate(
            builder: "App\\GraphQL\\Connector\\Movipass\\Builders\\MechanicOrdersBuilder@build"
            defaultCount: 25
        )

    exportMechanicOrders(
        format: ExportFormat!
        all: Boolean
        mechanic_id: ID
        mechanic_filter: MechanicFilterEnum
        provider_id: ID
        field_mapper: Mixed
        metadata: ExportMetadataInput
        timezone: String
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "users_id"
                    "created_at"
                    "updated_at"
                    "fulfillment_status"
                ]
            )
        orderStatus: _
            @whereConditions(
                columns: ["name", "slug", "order_type_id", "id"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderStatusHandler"
            )
        orderBy: _
            @orderBy(columns: ["id", "created_at", "updated_at"])
    ): OrderExportResult!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\ExportMechanicOrdersQuery@export"
        )

    exportMechanics(
        format: ExportFormat!
        company_id: ID
        availability: MechanicAvailabilityEnum
        service_type: String
        field_mapper: Mixed
        metadata: ExportMetadataInput
        timezone: String
        where: _
            @whereConditions(columnsEnum: MechanicWhereColumn)
        orderBy: _
            @orderBy(columns: ["id", "firstname", "lastname", "created_at"])
    ): OrderExportResult!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\ExportMechanicsQuery@export"
        )
}

enum RoadsideServiceTypeEnum {
    jump_start
    fuel_delivery
    light_tow
    designated_driver
    tire_change
    accident_tow
    motorcycle_tow
    locksmith
}

type RoadsideIntakeField {
    key: String!
    label: String!
    "One of: text, boolean, number, choice, datetime"
    type: String!
    required: Boolean!
    "Allowed values, populated for choice fields only"
    options: [String!]!
    "Key of the boolean field that has to answer true before this one is required"
    required_when: String
    hint: String
}

type RoadsideServiceIntake {
    service_type: String!
    label: String!
    "Whether the case is rejected without at least one photo attached"
    requires_photos: Boolean!
    "Asked for every service before the service-specific block"
    general_fields: [RoadsideIntakeField!]!
    service_fields: [RoadsideIntakeField!]!
}

type RoadsideNotProceedReason {
    value: String!
    label: String!
}

extend type Query @guard {
    "The operator intake script: the shared questions plus the per-service block. Omit service_type to get every service."
    roadsideAssistanceIntake(service_type: RoadsideServiceTypeEnum): [RoadsideServiceIntake!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideIntakeQuery@get"
        )

    "Reasons a case can be declined at the authorization gate."
    roadsideAssistanceNotProceedReasons: [RoadsideNotProceedReason!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\Movipass\\Queries\\RoadsideIntakeQuery@notProceedReasons"
        )
}
