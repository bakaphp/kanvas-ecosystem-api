extend type Query @guard {
    ordersByUserCustomField(
        custom_field_name: String!
        user_id: ID
        orderStatus: _
            @whereConditions(
                columns: ["name", "slug", "order_type_id", "id"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderStatusHandler"
            )
        orderType: _
            @whereConditions(
                columns: ["name"]
                handler: "App\\GraphQL\\Souk\\Handlers\\OrderTypeHandler"
            )
        orderBy: _
            @orderBy(columns: ["id", "created_at", "updated_at", "status"])
    ): [Order!]!
        @paginate(
            builder: "App\\GraphQL\\Souk\\Queries\\Orders\\OrdersByUserCustomFieldQuery@build"
            defaultCount: 25
        )
}
