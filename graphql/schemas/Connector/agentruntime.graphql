input MigrateAgentWorkspaceInput {
    source_deployment_id: ID!
    destination_machine_id: ID!
    "Full path to the workspace directory on the source server (defaults to ~/.openclaw)"
    source_path: String
    "Parent directory to extract into on the destination server (defaults to agent home directory)"
    destination_path: String
}

type AgentDeploymentEvent {
    "Auto-increment primary key"
    id: ID!
    "ID of the AgentDeployment this event belongs to"
    deployment_id: ID!
    "One of: gateway_down | gateway_up | health_fail | health_recover | session_started | agent_unreachable"
    event_type: String!
    "JSON-encoded map of contextual values that triggered the event (previous/current states, counts, errors)"
    payload: String
    "ISO-8601 timestamp when the event occurred"
    occurred_at: String!
}

type AgentLogEntry {
    "ISO-8601 timestamp from the log line, empty string when unavailable"
    ts: String!
    "Log level: debug | info | warn | error"
    level: String!
    "Human-readable log message"
    msg: String!
    "JSON-encoded map of any extra structured fields present in the log line"
    meta: String
}

extend type Query @guardByAdmin {
    agentCurrentTelemetry(deployment_id: ID!): AgentTelemetryData
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Queries\\AgentTelemetryQuery"
        )

    agentDeploymentLogs(
        "ID of the AgentDeployment to fetch logs for"
        deployment_id: ID!
        "Maximum number of log lines to return (default 100, max 500)"
        limit: Int
    ): [AgentLogEntry!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Queries\\AgentDeploymentLogsQuery"
        )

    agentDeploymentEvents(
        "ID of the AgentDeployment to fetch events for"
        deployment_id: ID!
        "Maximum number of events to return, newest first (default 50, max 200)"
        limit: Int
    ): [AgentDeploymentEvent!]!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Queries\\AgentDeploymentEventsQuery"
        )
}

extend type Subscription {
    agentTelemetry(deployment_id: ID!): AgentTelemetryData
        @subscription(
            class: "App\\GraphQL\\Connector\\AgentRuntime\\Subscriptions\\AgentTelemetrySubscription"
        )
}

extend type Mutation @guard {
    agentRuntimeCreateMachine(input: AgentMachineInput!): AgentMachineType!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentMachineMutation@create"
        )
    agentRuntimeUpdateMachine(id: ID!, input: UpdateAgentMachineInput!): AgentMachineType!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentMachineMutation@update"
        )
    agentRuntimeDeleteMachine(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentMachineMutation@delete"
        )
    agentRuntimeUpdateMachineContainers(machine_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentMachineMutation@updateContainers"
        )
    agentRuntimePingMachine(machine_id: ID!): AgentMachineType!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentMachineMutation@ping"
        )

    agentRuntimeBackupAgent(deployment_id: ID!, include_workspace: Boolean): AgentBackupType!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@backup"
        )

    agentRuntimeLaunchAgent(input: LaunchAgentInput!): AgentDeploymentType!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@launch"
        )
    agentRuntimeTerminateAgent(deployment_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@terminate"
        )
    agentRuntimeRestartContainer(deployment_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@restart"
        )
    agentRuntimeContainerLogs(deployment_id: ID!, lines: Int): String!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@logs"
        )
    agentRuntimeContainerStatus(deployment_id: ID!): AgentDeploymentType!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@status"
        )
    agentRuntimeCollectUsage(deployment_id: ID!): AgentUsageSnapshot!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@collectUsage"
        )

    agentRuntimeSetSlackTokens(agent_id: ID!, slack_bot_token: String!, slack_app_token: String!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@setSlackTokens"
        )

    agentRuntimeSetTelegramToken(agent_id: ID!, telegram_bot_token: String!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@setTelegramToken"
        )

    agentRuntimeMigrateAgentWorkspace(input: MigrateAgentWorkspaceInput!): AgentDeploymentType!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@migrateWorkspace"
        )
}

extend type Mutation @guardByAppKey {
    agentRuntimeExecCommand(deployment_id: ID!, command: String!, session_id: String!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@execCommand"
        )
    agentRuntimeGetConfig(deployment_id: ID!): String!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@getConfig"
        )
    agentRuntimeUpdateConfig(deployment_id: ID!, config: String!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\AgentRuntime\\Mutations\\AgentDeploymentMutation@updateConfig"
        )
}
