type ApolloCleanupReport {
    from: String
    to: String
    verifiedPeople: Int!
    totalPeople: Int!
    verifiedPct: Float!
    changedCompany: Int!
    changedTitle: Int!
    changedEmail: Int!
    promotedToDecisionMaker: Int!
    newAccounts: Int!
    bouncingPeople: Int!
    byCompany: [ApolloCompanyFreshness!]!
}

type ApolloCompanyFreshness {
    companyName: String!
    total: Int!
    upToDate: Int!
    outdated: Int!
}

extend type Query @guard {
    apolloCleanupReport(
        from: String
        to: String
        topCompanies: Int = 5
    ): ApolloCleanupReport!
        @field(
            resolver: "App\\GraphQL\\Connector\\Apollo\\Queries\\CleanupReportQuery@report"
        )
}
