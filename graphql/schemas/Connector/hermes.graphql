input HermesLaunchAgentInput {
    agent_id: ID!
    machine_id: ID!
}

input HermesMigrateFromOpenClawInput {
    "ID of the source OpenClaw AgentDeployment to migrate from"
    source_deployment_id: ID!
    "ID of the Hermes AgentMachine to deploy onto"
    destination_machine_id: ID!
    "Full path to the .openclaw directory on the source server (defaults to ~/.openclaw)"
    source_path: String
    "Parent directory to extract into on the destination server (defaults to agent home directory)"
    destination_path: String
}

extend type Mutation @guard {
    hermesLaunchAgent(input: HermesLaunchAgentInput!): AgentDeploymentType!
        @field(
            resolver: "App\\GraphQL\\Connector\\Hermes\\Mutations\\AgentDeploymentMutation@launch"
        )

    hermesMigrateFromOpenclaw(input: HermesMigrateFromOpenClawInput!): AgentDeploymentType!
        @field(
            resolver: "App\\GraphQL\\Connector\\Hermes\\Mutations\\AgentDeploymentMutation@migrateFromOpenclaw"
        )
}
