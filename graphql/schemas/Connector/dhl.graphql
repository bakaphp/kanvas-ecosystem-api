input DhlOriginInput {
    company_name: String!
    contact_name: String!
    phone: String!
    email: String!
    address_line1: String!
    city: String!
    postal_code: String!
    country_code: String!
}

input DhlSetupInput {
    company_id: ID
    region_id: ID!
    username: String!
    password: String!
    account_number: String!
    origin: DhlOriginInput!
    base_url: String
    signature_service: String
    label_template: String
    request_pickup: Boolean
    pickup_close_time: String
    content_description: String
}

extend type Mutation @guard {
    dhlSetup(input: DhlSetupInput!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\Dhl\\Mutations\\DhlMutation@setup"
        )
}
