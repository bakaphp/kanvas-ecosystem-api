input ConnectSlackAgentInput {
    agent_id: ID!
    "Bot token (xoxb-…) from the app's OAuth & Permissions page. A user token (xoxp-) is rejected."
    bot_token: String!
    "Signing secret from the app's Basic Information page. Used to verify every inbound event."
    signing_secret: String!
}

type SlackAgentManifest {
    "Slack app manifest for this agent. Paste into Slack's 'create from manifest' if the link is blocked."
    manifest_json: String!
    "Open this: Slack creates the app in the user's own workspace, pre-wired to us. Needs a Slack admin."
    install_url: String!
    "Where the agent's Slack app posts events. Stable across disconnect/reconnect."
    request_url: String!
}

type SlackAgentConnection {
    connected: Boolean!
    team_id: String!
    team_name: String!
    bot_user_id: String!
    request_url: String!
}

extend type Query @guard {
    "Step 1 — mint the agent's Slack app manifest + install link. Creates the agent's receiver on first call."
    slackAgentManifest(agent_id: ID!): SlackAgentManifest!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackConnectorResolver@manifest"
        )

    "Is this agent currently listening on Slack? null when not connected — use it to render the tile on load."
    slackAgentConnection(agent_id: ID!): SlackAgentConnection
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackConnectorResolver@connection"
        )
}

extend type Mutation @guard {
    "Step 2 — bind the installed Slack app to the agent. Validates the token against Slack (auth.test) and reads back the bot user + team."
    connectSlackAgent(input: ConnectSlackAgentInput!): SlackAgentConnection!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackConnectorResolver@connect"
        )

    "Stop the agent listening on Slack. Keeps the receiver URL so reconnecting doesn't need a new Slack app."
    disconnectSlackAgent(agent_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackConnectorResolver@disconnect"
        )
}
