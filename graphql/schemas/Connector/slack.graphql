input ConnectSlackAgentInput {
    agent_id: ID!
    bot_token: String!
    signing_secret: String!
}

type SlackAgentManifest {
    manifest_json: String!
    install_url: String!
    request_url: String!
}

type SlackAgentConnection {
    connected: Boolean!
    team_id: String!
    team_name: String!
    bot_user_id: String!
    request_url: String!
}

extend type Query @guard {
    slackAgentManifest(agent_id: ID!): SlackAgentManifest!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackConnectorResolver@manifest"
        )

    slackAgentConnection(agent_id: ID!): SlackAgentConnection
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackConnectorResolver@connection"
        )
}

extend type Mutation @guard {
    connectSlackAgent(input: ConnectSlackAgentInput!): SlackAgentConnection!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackConnectorResolver@connect"
        )

    disconnectSlackAgent(agent_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackConnectorResolver@disconnect"
        )
}

type SlackWorkspaceListenerManifest {
    manifest_json: String!
    install_url: String!
    request_url: String!
}

type SlackWorkspaceListenerStatus {
    connected: Boolean!
    team_id: String!
    team_name: String!
    bot_user_id: String!
    request_url: String!
    channels_joined: Int!
}

input ConnectSlackWorkspaceListenerInput {
    bot_token: String!
    signing_secret: String!
    channel_deny_list: [String!]
    ingest_files: Boolean
}

extend type Query @guardByAdmin {
    slackWorkspaceListenerManifest: SlackWorkspaceListenerManifest!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackListenerResolver@manifest"
        )

    slackWorkspaceListenerStatus: SlackWorkspaceListenerStatus
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackListenerResolver@status"
        )
}

extend type Mutation @guardByAdmin {
    connectSlackWorkspaceListener(
        input: ConnectSlackWorkspaceListenerInput!
    ): SlackWorkspaceListenerStatus!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackListenerResolver@connect"
        )

    disconnectSlackWorkspaceListener: Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackListenerResolver@disconnect"
        )

    resyncSlackWorkspaceChannels: Boolean!
        @field(
            resolver: "App\\GraphQL\\Connector\\Slack\\SlackListenerResolver@resync"
        )
}
