enum ProductDiscoveryScope {
    APP
    COMPANY
}

input EnableProductDiscoveryInput {
    "APP sets the flags for every company that has not set its own; COMPANY sets them for company_id only."
    scope: ProductDiscoveryScope!
    "Required when scope is COMPANY, and not allowed when it is APP."
    company_id: ID
    "Writes search blurbs and facets, one LLM call per product. Omit to leave the current value."
    enrichment: Boolean
    "Semantic discovery instead of the SQL fallback. Omit to leave the current value."
    discovery: Boolean
}

type ProductDiscoveryIndexSetup {
    "prepared, unchanged, refused, failed or skipped"
    status: String!
    index: String
    changes: [String!]!
    message: String
}

type ProductDiscoverySetupResult {
    scope: ProductDiscoveryScope!
    "The engine the app already runs products on; setup never changes it."
    engine: String!
    index: ProductDiscoveryIndexSetup!
    enrichment: Boolean
    discovery: Boolean
    "Products queued for enrichment. Only a COMPANY scope that turns enrichment on queues any."
    backfill_queued: Int!
}

extend type Mutation @guardByAppKey {
    enableProductDiscovery(
        input: EnableProductDiscoveryInput!
    ): ProductDiscoverySetupResult!
        @field(
            resolver: "App\\GraphQL\\Inventory\\Mutations\\Products\\ProductDiscoverySetupMutation@enable"
        )
}
