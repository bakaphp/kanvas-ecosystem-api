type RegionSettings {
    language: String
    flag: String
    payment_gateways: [String!]
    default_payment_gateway: String
    timezone: String
}

type Region {
    id: ID!
    companies_id: Int!
    currency_id: Int!
    companies: Company @belongsTo(relation: "company")
    currencies: Currency! @belongsTo(relation: "currencies")
    uuid: String!
    name: String!
    slug: String!
    short_slug: String!
    settings: String @rename(attribute: "settings_string")
    settingsData: RegionSettings @rename(attribute: "settings")
    is_default: Boolean!
    lat: Float
    lng: Float
}

input RegionInput {
    currency_id: ID!
    name: String!
    slug: String
    companies_id: ID
    short_slug: String!
    settings: String
    is_default: Int!
    lat: Float
    lng: Float
}
input RegionInputUpdate {
    currency_id: ID
    name: String
    slug: String
    short_slug: String
    settings: String
    is_default: Int
    lat: Float
    lng: Float
}

input RegionReferenceInput {
    id: ID!
    name: String
    slug: String
}

extend type Query @guard {
    regions(
        where: _
            @whereConditions(
                columns: [
                    "id"
                    "name"
                    "slug"
                    "short_slug"
                    "is_default"
                    "companies_id"
                ]
            )
        orderBy: _ @orderBy(columns: ["id", "name", "created_at", "is_default"])
    ): [Region!]!
        @paginate(
            builder: "App\\GraphQL\\Inventory\\Builders\\Regions\\Region@all"
            scopes: ["fromApp", "fromCompanyOrGlobal", "notDeleted"]
            defaultCount: 25
        )
}
extend type Mutation @guard {
    createRegion(input: RegionInput!): Region!
        @field(
            resolver: "App\\GraphQL\\Inventory\\Mutations\\Regions\\Region@create"
        )
    updateRegion(id: ID!, input: RegionInputUpdate!): Region!
        @field(
            resolver: "App\\GraphQL\\Inventory\\Mutations\\Regions\\Region@update"
        )
    deleteRegion(id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Inventory\\Mutations\\Regions\\Region@delete"
        )
    setDefaultRegion(region_id: ID!): Boolean!
        @field(
            resolver: "App\\GraphQL\\Inventory\\Mutations\\Regions\\Region@setDefaultRegion"
        )
    setCompanyDefaultRegion(region_id: ID!): Boolean!
        @guardByAdmin
        @field(
            resolver: "App\\GraphQL\\Inventory\\Mutations\\Regions\\Region@setCompanyDefaultRegion"
        )
}
